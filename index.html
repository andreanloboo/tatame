<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Tatame</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
  :root {
    --bg: #F5F2EB;
    --frame: #E9E5DB;
    --surface: #FBFAF6;
    --surface-2: #EFEBE2;
    --ink: #1C1B19;
    --ink-2: #5E5B54;
    --ink-3: #9A968C;
    --line: #DDD8CC;
    --accent: #C2341F;
    --accent-ink: #FFFFFF;
    --accent-soft: #F6E4DE;
    --accent-glow: rgba(194, 52, 31, .25);
    --pill: #FBFAF6;
    --pill-icon: #9A968C;
    --belt: #5B3921;
    --belt-dark: #3E2615;
    --ok: #4F7A5A;
    --ok-soft: #E3EBE2;
    --warn: #A9761F;
    --warn-soft: #F3EAD4;
    --shadow: 0 18px 40px rgba(28, 27, 25, .10);
    --shadow-sm: none;
    --bubble-them: #EFEBE2;
    --info: #4A6B8A;
    --info-soft: #E2E9EF;
    --violet: #6E5B85;
    --violet-soft: #EAE4EF;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151412;
      --frame: #0F0E0D;
      --surface: #1D1C19;
      --surface-2: #26241F;
      --ink: #EDE8DD;
      --ink-2: #A8A395;
      --ink-3: #6E6A60;
      --line: #2F2D27;
      --accent: #D6482F;
      --accent-soft: #3A211B;
      --accent-glow: rgba(214, 72, 47, .3);
      --pill: #1D1C19;
      --pill-icon: #6E6A60;
      --belt: #6B4426;
      --belt-dark: #452A17;
      --ok: #86B08F;
      --ok-soft: #1F2C22;
      --warn: #D2A04A;
      --warn-soft: #332A17;
      --shadow: 0 18px 40px rgba(0, 0, 0, .5);
      --shadow-sm: none;
      --bubble-them: #26241F;
      --info: #8FAAC4;
      --info-soft: #1C2731;
      --violet: #A692BD;
      --violet-soft: #2A2433;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151412;
    --frame: #0F0E0D;
    --surface: #1D1C19;
    --surface-2: #26241F;
    --ink: #EDE8DD;
    --ink-2: #A8A395;
    --ink-3: #6E6A60;
    --line: #2F2D27;
    --accent: #D6482F;
    --accent-soft: #3A211B;
    --accent-glow: rgba(214, 72, 47, .3);
    --pill: #1D1C19;
    --pill-icon: #6E6A60;
    --belt: #6B4426;
    --belt-dark: #452A17;
    --ok: #86B08F;
    --ok-soft: #1F2C22;
    --warn: #D2A04A;
    --warn-soft: #332A17;
    --shadow: 0 18px 40px rgba(0, 0, 0, .5);
    --shadow-sm: none;
    --bubble-them: #26241F;
    --info: #8FAAC4;
    --info-soft: #1C2731;
    --violet: #A692BD;
    --violet-soft: #2A2433;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--frame);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Noto Sans", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    align-items: stretch;
    min-height: 100dvh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  .cond { font-family: "Zen Kaku Gothic New", "Noto Sans", system-ui, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- app shell ---------- */
  .app {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: 100dvh;
    background: var(--bg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 640px) {
    body { align-items: center; padding: 24px 0; }
    .app {
      height: min(900px, calc(100dvh - 48px));
      border-radius: 32px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }
  }
  .screen {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 24px 20px 120px;
    scrollbar-width: none;
  }
  .screen::-webkit-scrollbar { display: none; }
  .screen.chat-thread { padding-bottom: 0; display: flex; flex-direction: column; }

  /* ---------- tab bar: barra clara, indicador em ponto vermelhão ---------- */
  .tabbar {
    position: absolute;
    left: 20px; right: 20px; bottom: 16px;
    height: 64px;
    background: var(--pill);
    border: 1px solid var(--line);
    border-radius: 20px;
    display: flex;
    align-items: stretch;
    box-shadow: 0 12px 32px rgba(28, 27, 25, .10);
    z-index: 10;
    overflow: hidden;
  }
  .tabbar[hidden] { display: none; }
  .tabbar .ind {
    position: absolute;
    top: 0; left: 0;
    width: calc(100% / 6);
    height: 100%;
    pointer-events: none;
    transition: transform .42s cubic-bezier(.22, 1, .36, 1);
  }
  .tabbar .ind::after {
    content: "";
    position: absolute;
    left: 50%; bottom: 9px;
    width: 6px; height: 6px;
    transform: translateX(-50%);
    background: var(--accent);
    border-radius: 50%;
  }
  .tabbar button {
    position: relative;
    flex: 1;
    background: none;
    border: 0;
    color: var(--pill-icon);
    display: grid;
    place-items: center;
    z-index: 1;
    transition: color .25s;
    -webkit-tap-highlight-color: transparent;
  }
  .tabbar button:focus-visible { outline-offset: -6px; border-radius: 14px; }
  .tabbar button.on { color: var(--ink); }
  .tabbar button svg { width: 21px; height: 21px; transition: transform .35s cubic-bezier(.22, 1, .36, 1); }
  .tabbar button.on svg { transform: translateY(-3px); }
  .tabbar .badge {
    position: absolute; top: 17px; right: calc(50% - 15px);
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--pill);
  }
  .tabbar .badge[hidden] { display: none; }

  /* ---------- common ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 24px; }
  .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .title { font-family: "Zen Kaku Gothic New", "Noto Sans", system-ui, sans-serif; font-weight: 700; font-size: 27px; line-height: 1.15; letter-spacing: -.01em; }
  .h2 { font-family: "Zen Kaku Gothic New", "Noto Sans", system-ui, sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0; }
  .muted { color: var(--ink-2); }
  .small { font-size: 13px; }
  .section { margin-top: 30px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .linkbtn { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 13px; padding: 0; }

  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--ink); color: var(--bg);
    font-family: "Zen Kaku Gothic New", "Noto Sans", system-ui, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: .02em;
    flex: none;
  }
  .avatar.sm { width: 26px; height: 26px; font-size: 11px; }
  .avatar.lg { width: 68px; height: 68px; font-size: 26px; }
  .avatar[data-belt="Branca"] { background: #E9E9EC; color: #333; }
  .avatar[data-belt="Azul"] { background: #2456B8; color: #fff; }
  .avatar[data-belt="Roxa"] { background: #6B3FA0; color: #fff; }
  .avatar[data-belt="Marrom"] { background: var(--belt); color: #fff; }
  .avatar[data-belt="Preta"] { background: #111; color: #fff; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }

  .btn {
    border: 0; border-radius: 10px;
    padding: 11px 16px;
    font-weight: 600; font-size: 14px;
    background: var(--ink); color: var(--bg);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .15s, background .2s;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: var(--surface-2); color: var(--ink); }
  .btn.ok { background: var(--ok-soft); color: var(--ok); }
  .btn.block { width: 100%; }
  .btn svg { width: 18px; height: 18px; }
  .btn.sm { padding: 9px 14px; font-size: 13px; border-radius: 10px; height: 38px; }
  .btn.sm svg { width: 16px; height: 16px; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600; color: var(--ink-2);
  }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 600; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.soft { background: var(--surface-2); color: var(--ink-2); }
  .pill.accent { background: var(--accent-soft); color: var(--accent); }

  /* belt */
  .belt { width: 100%; height: 26px; display: block; }

  /* home class card */
  .class-card { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start; }
  .class-card .time { font-family: "Zen Kaku Gothic New", "Noto Sans", system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1; letter-spacing: -.02em; min-width: 62px; }
  .class-card .dur { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
  .class-card .name { font-weight: 700; font-size: 16px; }
  .class-card .meta { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
  .class-card .foot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; padding-top: 14px; border-top: 1px solid var(--line); }
  .class-card .foot .actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .stackav { display: flex; }
  .stackav .avatar.sm { border: 2px solid var(--surface); margin-left: -8px; }
  .stackav .avatar.sm:first-child { margin-left: 0; }
  .class-card.mine { border-color: var(--accent); }
  .class-card.past { opacity: .82; }

  .progress { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .6s cubic-bezier(.22, 1, .36, 1); }

  .weekdots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .weekdots .d { display: grid; gap: 6px; justify-items: center; font-size: 11px; color: var(--ink-3); font-weight: 600; }
  .weekdots .dot { width: 30px; height: 30px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-3); }
  .weekdots .dot.on { background: var(--accent); color: #fff; }
  .weekdots .dot.today { box-shadow: 0 0 0 2px var(--ink) inset; }
  .weekdots .dot svg { width: 14px; height: 14px; }

  /* day selector */
  .days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 22px; }
  .days button {
    border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 0 7px; display: grid; gap: 2px; justify-items: center;
    color: var(--ink-2);
  }
  .days button b { font-family: "Zen Kaku Gothic New", "Noto Sans", system-ui, sans-serif; font-size: 20px; color: var(--ink); line-height: 1; }
  .days button small { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .days button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .days button.on b { color: var(--bg); }
  .days button.today small::after { content: ""; display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin-left: 4px; vertical-align: middle; }

  .timeline { display: grid; gap: 12px; }
  .slot { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; }
  .slot .t { font-family: "Zen Kaku Gothic New", "Noto Sans", system-ui, sans-serif; font-weight: 700; font-size: 19px; line-height: 1; min-width: 54px; padding-right: 10px; border-right: 1px solid var(--line); }
  .slot .g { font-weight: 600; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .slot .g .gn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gi { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; flex: none; }
  .gi svg { width: 15px; height: 15px; stroke-width: 2; }
  .gi[data-belt="Branca"] { background: #D9D9DF; box-shadow: 0 0 0 1px rgba(0, 0, 0, .12) inset; }
  .gi[data-belt="Azul"] { background: #2456B8; }
  .gi[data-belt="Roxa"] { background: #6B3FA0; }
  .gi[data-belt="Marrom"] { background: var(--belt); }
  .gi[data-belt="Preta"] { background: #111; }
  .slot .c { font-size: 12.5px; color: var(--ink-2); line-height: 1.4; }
  .slot .actions { display: flex; gap: 8px; }
  .iconbtn { width: 38px; height: 38px; border-radius: 10px; border: 0; background: var(--surface-2); color: var(--ink); display: grid; place-items: center; }
  .iconbtn svg { width: 18px; height: 18px; }
  .iconbtn.on { background: var(--accent); color: #fff; }
  .iconbtn.ok { background: var(--ok-soft); color: var(--ok); }
  .iconbtn.wait { background: var(--warn-soft); color: var(--warn); }
  .iconbtn.off { background: var(--surface-2); color: var(--ink-3); }
  .iconbtn.cancel { background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); flex: none; }
  .status.grow { min-width: 0; }
  .status { display: flex; align-items: center; gap: 8px; border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 13px; }
  .status.sm { height: 38px; padding: 0 12px; white-space: nowrap; }
  .pending { display: inline-flex; align-items: stretch; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); height: 38px; }
  .pending .status { border-radius: 0; height: 100%; }
  .pending .iconbtn { border-radius: 0; border: 0; border-left: 1px solid var(--line); width: 36px; height: 100%; background: var(--surface); color: var(--ink-2); }
  .status svg { width: 16px; height: 16px; flex: none; }
  .status.ok { background: var(--ok-soft); color: var(--ok); }
  .status.wait { background: var(--warn-soft); color: var(--warn); }
  .status.muted { background: var(--surface-2); color: var(--ink-2); font-weight: 500; }

  /* chat */
  .thread-list { display: grid; gap: 10px; }
  .thread { display: grid; grid-template-columns: 50px 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; text-align: left; width: 100%; }
  .thread .ico { width: 50px; height: 46px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; font-family: "Zen Kaku Gothic New", "Noto Sans", system-ui, sans-serif; font-weight: 700; font-size: 13.5px; letter-spacing: -.02em; color: var(--ink); }
  .thread .ico.accent { background: var(--accent); color: #fff; }
  .thread .n { font-weight: 600; }
  .thread .p { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread .ts { font-size: 11px; color: var(--ink-3); }
  .thread .side { display: grid; justify-items: end; gap: 6px; align-self: start; padding-top: 3px; }
  .thread.unread .ts { color: var(--ok); font-weight: 700; }
  .thread.unread .p { color: var(--ink); font-weight: 500; }
  .unread-badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--ok); color: #fff; font-size: 11.5px; font-weight: 700; display: inline-grid; place-items: center; }
  .newsep { align-self: stretch; text-align: center; font-size: 11px; color: var(--ok); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--ok-soft); border-radius: 8px; padding: 6px 10px; margin: 6px 0; }

  .chat-head { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .backbtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; }
  .backbtn svg { width: 18px; height: 18px; }
  .msgs { flex: 1; overflow-y: auto; padding: 14px 0; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; }
  .msgs::-webkit-scrollbar { display: none; }
  .daysep { align-self: center; font-size: 11px; color: var(--ink-3); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin: 6px 0; }
  .msg { display: flex; gap: 8px; max-width: 86%; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg .bubble { background: var(--bubble-them); border-radius: 16px 16px 16px 5px; padding: 9px 12px; }
  .msg.me .bubble { background: var(--accent); color: #fff; border-radius: 16px 16px 5px 16px; }
  .msg .who { font-size: 11px; font-weight: 700; color: var(--ink-2); margin-bottom: 2px; }
  .msg .who .r { color: var(--accent); font-weight: 600; }
  .msg .txt { white-space: pre-wrap; word-break: break-word; }
  .msg .ts { font-size: 10px; opacity: .65; text-align: right; margin-top: 3px; }
  .composer { display: flex; gap: 8px; padding: 10px 0 100px; }
  .composer input { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 11px 16px; min-width: 0; }
  .composer button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
  .composer button svg { width: 18px; height: 18px; }

  /* frequência */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat .v { font-family: "Zen Kaku Gothic New", "Noto Sans", system-ui, sans-serif; font-weight: 700; font-size: 36px; line-height: 1; }
  .stat .l { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
  .ring-wrap { display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: center; }
  .ring-col { display: grid; justify-items: center; gap: 6px; }
  .ring-lbl { font-size: 11px; color: var(--ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; }
  .ring { width: 120px; height: 120px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .ring .c b { font-family: "Zen Kaku Gothic New", "Noto Sans", system-ui, sans-serif; font-weight: 700; font-size: 40px; line-height: 1; display: block; letter-spacing: -.02em; }
  .ring .c small { font-size: 11px; color: var(--ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .req { display: grid; gap: 8px; }
  .req .r { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
  .req .r .ck { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-3); }
  .req .r .ck.done { background: var(--ok-soft); color: var(--ok); }
  .req .r .ck svg { width: 13px; height: 13px; }
  .req .r .n { font-size: 13px; color: var(--ink-2); }
  .chart { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; align-items: end; height: 110px; padding-top: 10px; position: relative; }
  .chart .goal { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--ink-3); pointer-events: none; }
  .chart .goal span { position: absolute; right: 0; top: -16px; font-size: 10px; color: var(--ink-3); font-weight: 600; }
  .chart .bar { position: relative; display: grid; align-items: end; height: 100%; }
  .chart .bar i { display: block; border-radius: 6px 6px 3px 3px; background: var(--ink-3); opacity: .45; }
  .chart .bar.hit i { background: var(--accent); opacity: 1; }
  .chart .bar.cur i { outline: 2px solid var(--ink); outline-offset: -2px; }
  .chart .bar b { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--ink-2); font-weight: 600; }
  .chart-labels { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-top: 6px; font-size: 10px; color: var(--ink-3); text-align: center; }
  .history { display: grid; gap: 8px; }

      pattern.forEach(off => {
        const d = addDays(w, off);
        if (d >= parse(lastGrau) && classEnd(key(d), byId.c3) < now()) out[`${key(d)}|c3`] = true;
      });
      if (wk === '2026-07-27') { const sat = addDays(w, 5); if (sat < today) out[`${key(sat)}|c8`] = true; }
    }
    return out;
  }

  // Confirmações de aulas que já passaram ficam como "aguardando o professor" até a presença ser registrada.
  function settleConfirmations() {
    let changed = false;
    Object.keys(state.confirmations).forEach(k => {
      if (state.attendance[k]) { delete state.confirmations[k]; changed = true; }
    });
    if (changed) save();

  const isConfirmed = (dk, c) => !!state.confirmations[`${dk}|${c.id}`];
  const attended = (dk, c) => !!state.attendance[`${dk}|${c.id}`];
  const attendanceList = () => Object.keys(state.attendance).map(k => { const [d, cid] = k.split('|'); return { date: d, cls: byId[cid] }; })
    .filter(x => x.cls).sort((a, b) => a.date < b.date ? 1 : -1);

  function nextRank(p) {
    if (p.belt === 'Preta') return p.stripes < 6 ? `${p.stripes + 1}º grau` : 'Coral';
    if (p.stripes < 4) return `${p.stripes + 1}º grau`;
    return `Faixa ${BELTS[BELTS.indexOf(p.belt) + 1]}`;
  }

  function progress() {
    const p = state.profile, r = state.rule;
    const since = p.lastGrau;
    const done = Object.keys(state.attendance).filter(k => k.split('|')[0] >= since).length;
    const target = r.perWeek * r.weeks;
    const days = Math.max(0, daysBetween(parse(since), now()));
    const daysLeft = Math.max(0, r.minDays - days);
    const left = Math.max(0, target - done);
    const weeksElapsed = Math.max(1, days / 7);
    const pace = done / weeksElapsed;
    const weeksNeeded = left / Math.max(0.5, Math.min(pace || r.perWeek, r.perWeek));
    const etaClasses = addDays(now(), Math.ceil(weeksNeeded * 7));
    const etaDays = addDays(parse(since), r.minDays);
    const eta = etaClasses > etaDays ? etaClasses : etaDays;
    return { done, target, left, days, daysLeft, pace, eta, ready: left === 0 && daysLeft === 0 };
  }

  function weekCount(mon) {
    const a = key(mon), b = key(addDays(mon, 7));
    return Object.keys(state.attendance).filter(k => { const d = k.split('|')[0]; return d >= a && d < b; }).length;
  }

  /* ---------------- ui: pieces ---------------- */
  function beltSVG(belt, stripes, h = 26) {
    const colors = { Branca: '#F2F2F2', Azul: '#2456B8', Roxa: '#6B3FA0', Marrom: 'var(--belt)', Preta: '#141414' };
    const bar = belt === 'Preta' ? '#C8202F' : '#141414';
    const W = 320, H = h;
    const barX = 214, barW = 78;
    let s = `<svg class="belt" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Faixa ${belt}, ${stripes} graus">`;
    s += `<rect x="0" y="0" width="${W}" height="${H}" rx="3" fill="${colors[belt]}"/>`;
    s += `<rect x="0" y="${H * .42}" width="${W}" height="1.2" fill="rgba(0,0,0,.18)"/>`;
    s += `<rect x="${barX}" y="0" width="${barW}" height="${H}" fill="${bar}"/>`;
    for (let i = 0; i < stripes; i++) {
      const x = barX + 10 + i * 14;
      s += `<rect x="${x}" y="0" width="6" height="${H}" fill="#F4F4F4"/>`;
    }
    s += '</svg>';
    return s;
  }

  function renderFreqBody() {
    const p = me(), r = state.rule, pr = progress();
    const pct = Math.min(1, pr.done / pr.target);
    const R = 52, C = 2 * Math.PI * R;
    const weeks = [...Array(10)].map((_, i) => addDays(monday(now()), -7 * (9 - i)));
