      details: ['Quem senta primeiro geralmente domina.', 'Esconda o seu calcanhar: quadril virado para fora protege.', 'Controle a perna dele na altura do joelho para impedir que ele gire.'],
      mistakes: ['Deitar plano e entregar o calcanhar.', 'Ficar parado esperando decisão dos árbitros.', 'Soltar a trava do pé no quadril.'],
      concept: { text: 'O 50/50 faz parte da hierarquia de ashi garami: uma posição de controle a partir da qual a finalização acontece quando o outro erra. Sem posição, não há finalização.', source: 'Sistema de ataques às pernas' },
      related: ['heel-hook', 'chave-de-pe', 'single-leg-x', 'saddle'] },

    { id: 'retencao', cat: 'guarda', name: 'Retenção de guarda', alt: 'Guard retention', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Como não ser passado: frames, quadril e distância, sempre nessa ordem.',
      idea: 'Retenção não é uma guarda, é o que mantém qualquer guarda viva. Você usa frames (braços e pernas) para ganhar distância, recupera com o quadril e reconecta os pés com o oponente antes que ele estabilize o peso.',
      steps: ['Quando ele passar as suas pernas, coloque frames: mão no ombro/pescoço e joelho por dentro.', 'Vire de lado, saia do plano do chão e leve o quadril para longe dele.', 'Recupere primeiro o joelho por dentro, depois o pé no quadril ou o gancho.', 'Reconecte: manga, gola, punho ou nuca.', 'Só depois, volte para uma guarda de ataque (fechada, borboleta, De La Riva).'],
      details: ['Joelho e cotovelo juntos formam a barreira mais forte do corpo.', 'A cabeça dele longe da sua garante espaço.', 'Movimento: recupere enquanto ele ainda se move, antes de fixar o peso.'],
      mistakes: ['Empurrar o oponente com os braços esticados e cansar.', 'Fazer frame e não mover o quadril.', 'Aceitar a meia guarda esmagada quando ainda dava tempo de recuperar.'],
      concept: { text: 'A retenção se divide em três zonas de perigo e três respostas: frames, movimento do quadril e reconexão. Aprender isso reduz drasticamente quantas vezes você é passado.', source: 'Fundamentos de retenção de guarda' },
      related: ['guarda-fechada', 'borboleta', 'meia-guarda', 'escape-cem-quilos'] },

    /* ===== RASPAGENS ===== */
    { id: 'tesoura', cat: 'raspagem', name: 'Raspagem tesoura', alt: 'Scissor sweep', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Da guarda fechada: uma perna corta baixo, a outra puxa o tronco dele, como uma tesoura.',
      idea: 'Você tira o apoio da perna dele com uma canela e derruba o tronco com a outra, enquanto controla manga e gola. É a primeira raspagem que todo mundo aprende, e uma das que mais funcionam quando feita com quadril de lado.',
      steps: ['Da guarda fechada, controle manga e gola cruzada.', 'Abra a guarda e vire de lado, apoiando a canela de cima na barriga dele, joelho apontando para o ombro.', 'A perna de baixo estica encostada no tatame, na altura do joelho dele.', 'Puxe manga e gola em direção ao seu peito para tirar o peso dele das pernas.', 'Faça a tesoura: perna de baixo varre o joelho dele, perna de cima gira o tronco. Suba na montada.'],
      details: ['Vire de lado antes de raspar; de costas planas não há tesoura.', 'Puxe primeiro, raspe depois: ele precisa estar leve.', 'Cotovelo da manga dele controlado para ele não apoiar a mão.'],
      mistakes: ['Raspar com o oponente com o peso apoiado nos joelhos.', 'Pé de baixo alto demais, sem varrer a base.', 'Soltar a manga na hora da queda.'],
      concept: { text: 'Toda raspagem tem três passos: tirar o apoio das mãos, tirar o apoio das pernas e mover o quadril na direção certa. A tesoura ensina os três.', source: 'Princípio de raspagem da guarda fechada' },
      related: ['guarda-fechada', 'hip-bump', 'pendulo', 'estrangulamento-cruzado'] },

    { id: 'hip-bump', cat: 'raspagem', name: 'Raspagem hip bump (opa)', alt: 'Hip bump sweep', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Ele endireita a postura na sua guarda fechada, você senta e bate o quadril para virar por cima.',
      idea: 'Quando o oponente levanta a postura e afasta o peso, a distância vira o seu amigo: você senta, apoia uma mão e joga o quadril contra ele. Se ele defender apoiando a mão, a guilhotina e a kimura estão logo ali.',
      steps: ['Da guarda fechada, espere ele levantar o tronco e abrir espaço.', 'Abra a guarda e sente apoiando uma mão no tatame atrás de você.', 'Com o outro braço, passe por cima do ombro dele e controle o tríceps ou o braço do mesmo lado.', 'Lance o quadril para cima e para o lado do braço controlado, girando sobre a mão apoiada.', 'Caia na montada, joelhos no chão.'],
      details: ['O quadril sobe alto: o movimento é para cima e para frente, não só para o lado.', 'Controle do braço impede que ele apoie e defenda.', 'Sente rápido: a janela é o momento em que ele ganha postura.'],
      mistakes: ['Tentar quando ele está com o peso para frente.', 'Sentar e empurrar com o braço em vez de usar o quadril.', 'Esquecer de controlar o braço e ele apoia a mão.'],
      concept: { text: 'Hip bump, kimura e guilhotina formam um triângulo de ataques: a defesa de um abre o outro. Pense em sistema, não em golpe isolado.', source: 'Sistema clássico de guarda fechada' },
      related: ['guarda-fechada', 'kimura', 'guilhotina', 'tesoura'] },

    { id: 'pendulo', cat: 'raspagem', name: 'Raspagem pêndulo (flor)', alt: 'Flower / pendulum sweep', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Você balança a perna como um pêndulo por baixo dele para virá-lo por cima do seu corpo.',
      idea: 'Controlando um braço e uma perna do oponente, você balança a perna livre, gera momento e vira o oponente. É a raspagem irmã do armlock da guarda fechada: se uma falha, a outra aparece.',
      steps: ['Da guarda fechada, controle a manga de um lado e, com a outra mão, agarre a calça (ou pegue por baixo da perna) do mesmo lado.', 'Abra a guarda, coloque a perna do lado da manga em cima do ombro dele.', 'Balance a outra perna para fora e para baixo, ganhando momento (o pêndulo).', 'Traga a perna de volta batendo na axila dele enquanto puxa manga e perna.', 'Role por cima e caia na montada.'],
      details: ['Coloque o joelho da perna de cima atrás da axila dele.', 'O pêndulo é uma perna só: a outra empurra o ombro.', 'Mantenha o braço dele preso durante toda a rolagem.'],
      mistakes: ['Raspar sem balanço, só com força.', 'Soltar o braço e ele apoia.', 'Tentar do lado errado (a perna presa é do lado do braço controlado).'],
      concept: { text: 'Armlock e pêndulo são uma dupla: o oponente que defende o braço apoiando dá a raspagem; o que defende a raspagem estica o braço.', source: 'Fundamentos de guarda fechada' },
      related: ['armlock', 'guarda-fechada', 'tesoura', 'omoplata'] },

    { id: 'raspagem-borboleta', cat: 'raspagem', name: 'Raspagem borboleta', alt: 'Butterfly sweep', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Underhook, gancho e queda diagonal. A raspagem mais eficiente do jogo sentado.',
      idea: 'Você usa um gancho borboleta para levantar a perna dele enquanto o carrega com o underhook. A queda é diagonal, para o ombro, não para o lado. Funciona em kimono, sem kimono e em qualquer tamanho de oponente.',
      steps: ['Da borboleta, garanta o underhook de um lado e controle o braço do outro.', 'Puxe o tronco dele para cima do seu, colando o peito no dele.', 'Deite para o lado do braço controlado (o lado oposto ao underhook).', 'Ao cair, eleve com o gancho do lado do underhook, joelho para fora.', 'Siga o movimento e suba na montada ou na meia guarda por cima.'],
      details: ['A queda é diagonal, na direção do seu ombro, nunca de lado plano.', 'O braço controlado não pode apoiar no chão.', 'Gancho levanta e joga a perna dele para longe ao mesmo tempo.'],
      mistakes: ['Deitar de costas primeiro e depois tentar levantar.', 'Raspar sem underhook.', 'Perna de gancho sem força por falta de rotação do quadril.'],
      concept: { text: 'Peso e apoio: você não levanta o oponente, você tira o apoio dele e deixa a gravidade fazer o resto. Isso só funciona com o tronco dele sobre você.', source: 'Fundamentos de guarda aberta' },
      related: ['borboleta', 'guarda-x', 'guilhotina', 'single-leg-x'] },

    { id: 'raspagem-meia-guarda', cat: 'raspagem', name: 'Raspagem da meia guarda (old school)', alt: 'Underhook sweep', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Underhook, sair por baixo e pegar o pé de fora dele. A raspagem clássica da meia guarda.',
      idea: 'Com o underhook, você se vira para o oponente, mergulha o joelho por baixo dele e captura o pé de fora. Sem aquele pé como base, ele cai para o lado da perna presa.',
      steps: ['Da meia guarda, ganhe o underhook e vire de lado, cabeça fora do lado da perna presa.', 'Suba com o joelho de cima e vá por baixo dele, como se fosse pegar as costas.', 'Com a mão livre, agarre o tornozelo ou o pé de fora dele.', 'Puxe o pé para você enquanto empurra o quadril dele com o ombro.', 'Passe por cima, saia da perna e caia em cem quilos ou meia guarda por cima.'],
      details: ['A cabeça fica embaixo do braço dele: nunca deixe o braço dele passar em volta do seu pescoço.', 'Puxe o pé dele para dentro, para debaixo de você.', 'Sequência: underhook, joelho, pé.'],
      mistakes: ['Tentar sem underhook.', 'Deixar o oponente pegar o whizzer forte e virar por cima.', 'Soltar a perna e deixar ele voltar para a base.'],
      concept: { text: 'Se ele usa o whizzer para defender, mude para as costas ou para o rolamento; a meia guarda é uma árvore de decisões, não uma raspagem só.', source: 'Fundamentos de meia guarda' },
      related: ['meia-guarda', 'meia-guarda-profunda', 'controle-costas'] },

    { id: 'raspagem-x', cat: 'raspagem', name: 'Raspagem da guarda X', alt: 'X-guard sweep', level: 'Azul', style: 'Gi e No-Gi',
      summary: 'Estenda o X, abra a base dele e levante em uma queda controlada.',
      idea: 'Da guarda X, você afasta as pernas dele até que só um apoio reste. Depois escolhe: derruba para trás controlando o pé ou levanta em technical stand-up com a perna dele ainda presa.',
      steps: ['Na guarda X, abrace a perna que está no ombro e mantenha a cabeça colada nela.', 'Estenda as pernas do X para afastar as pernas dele.', 'Para raspar para trás: puxe o pé da perna do ombro para o tatame, empurre com o X e ele senta.', 'Para levantar: gire para o lado, solte o gancho de cima e suba com a perna dele presa (single leg).', 'Finalize por cima, controlando a perna dele até estabilizar.'],
      details: ['Cabeça sempre colada: sem isso ele pressiona o seu queixo e agacha.', 'O pé no quadril mantém a distância.', 'Suba rápido: pontos são para quem estabiliza.'],
      mistakes: ['Raspar e ficar deitado.', 'Não controlar o pé da perna do ombro.', 'Deixar ele agachar e transformar em meia guarda esmagada.'],
      concept: { text: 'Quebrar a base é tudo: um adulto em pé com as pernas afastadas não consegue resistir a uma raspagem simples.', source: 'Fundamentos de guarda aberta' },
      related: ['guarda-x', 'single-leg-x', 'borboleta'] },

    { id: 'raspagem-tripe', cat: 'raspagem', name: 'Raspagem tripé', alt: 'Tripod sweep', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Segure um tornozelo, empurre o quadril e puxe o outro pé. Ele cai de bunda.',
      idea: 'Quando o oponente está em pé, você controla um tornozelo, empurra o quadril com um pé e captura a perna oposta com o outro. Sem base, ele senta, e você levanta.',
      steps: ['Com ele em pé e você sentado ou deitado, controle um tornozelo com a mão.', 'Coloque o pé do mesmo lado no quadril dele.', 'Com o outro pé, enganche por trás do joelho ou do tornozelo da perna oposta.', 'Puxe o gancho e empurre o quadril ao mesmo tempo. Ele cai sentado.', 'Levante com o tornozelo dele controlado e passe a guarda.'],
      details: ['Controle uma manga ou a gola se der: braço apoiado defende.', 'Empurre o quadril, não a coxa.', 'Levante imediatamente após a queda.'],
      mistakes: ['Empurrar antes de controlar o tornozelo.', 'Deixar ele apoiar a mão no tatame.', 'Ficar deitado depois de raspar.'],
      concept: { text: 'Contra oponente em pé, ataque a base: controle um pé, empurre o centro de gravidade e a queda é geometria.', source: 'Fundamentos de guarda aberta' },
      related: ['de-la-riva', 'raspagem-gancho', 'guarda-x'] },

    { id: 'raspagem-gancho', cat: 'raspagem', name: 'Raspagem da De La Riva', alt: 'DLR sweep', level: 'Azul', style: 'Gi e No-Gi',
      summary: 'Com o gancho De La Riva, puxe o calcanhar, estique o gancho e vire o oponente para fora.',
      idea: 'O gancho De La Riva enrola a perna e vira o joelho dele para dentro. Com o calcanhar controlado e uma manga, você estende o gancho e derruba o oponente para o lado da perna presa ou para trás.',
      steps: ['Da De La Riva, controle o calcanhar e a manga cruzada (ou a gola).', 'Coloque o pé livre no quadril ou no joelho da perna de trás dele.', 'Puxe a manga em direção ao seu peito para quebrar a postura.', 'Estenda o gancho De La Riva para fora e para cima enquanto puxa o calcanhar para dentro.', 'Ele cai para o lado; suba na guarda dele ou pegue as costas.'],
      details: ['Joelho dele virado para dentro antes de raspar.', 'O pé livre controla a distância ou tira a outra base.', 'Suba com a perna dele ainda controlada.'],
      mistakes: ['Raspar com o oponente em postura firme.', 'Soltar o calcanhar durante a queda.', 'Não usar o pé livre.'],
      concept: { text: 'Cada guarda aberta tem um par de raspagens opostas: se ele resiste a cair para um lado, o outro se abre. Treine as duas juntas.', source: 'Fundamentos de guarda aberta' },
      related: ['de-la-riva', 'berimbolo', 'raspagem-tripe', 'guarda-x'] },

    { id: 'raspagem-lasso', cat: 'raspagem', name: 'Raspagem do lasso', alt: 'Lasso sweep', level: 'Roxa', style: 'Gi',
      summary: 'Com o lasso travado, role para o lado e o oponente cai por cima do braço preso.',
      idea: 'O braço lassado não pode apoiar. Você gira o próprio corpo para o lado do lasso enquanto tira o apoio da perna dele com o outro pé. Ele cai e você sai por cima.',
      steps: ['Com o lasso profundo e a manga controlada, coloque o outro pé no joelho ou quadril dele.', 'Puxe a manga do lado do lasso para baixo e para o lado.', 'Empurre o joelho dele com o pé livre e gire o corpo para o lado do lasso.', 'Ele cai por cima do braço preso, sem conseguir apoiar.', 'Suba e passe a guarda mantendo a manga.'],
      details: ['Não solte a manga até estar por cima.', 'O lasso deve estar preso sob a axila.', 'Movimento circular do quadril, não empurrão.'],
      mistakes: ['Lasso raso que se solta na rolagem.', 'Ficar na posição sem ameaçar.', 'Não usar o pé livre para tirar a base.'],
      concept: { text: 'Quem não pode apoiar as mãos cai. Todo o jogo de lasso e aranha se baseia em anular os braços do passador.', source: 'Princípio de raspagem em guarda aberta' },
      related: ['lasso', 'aranha', 'omoplata'] },

    { id: 'berimbolo', cat: 'raspagem', name: 'Berimbolo', alt: 'Giro invertido para as costas', level: 'Roxa', style: 'Gi e No-Gi',
      summary: 'Da De La Riva, você gira invertido por baixo e chega nas costas do oponente.',
      idea: 'O berimbolo transforma a De La Riva em tomada de costas. Você derruba o oponente sentado, gira invertido mantendo o gancho e o cinto (ou o quadril) e sai atrás dele. ',
      steps: ['Da De La Riva, controle o cinto ou a calça na altura do quadril e o calcanhar.', 'Puxe para derrubar o oponente sentado, joelho dele para dentro.', 'Gire invertido, passando a cabeça por baixo, mantendo o gancho De La Riva.', 'Ao sair do giro, coloque o gancho de dentro nas costas dele e puxe o cinto.', 'Estabeleça o segundo gancho e o cinto de segurança.'],
      details: ['Não solte o controle do quadril durante o giro.', 'O gancho De La Riva puxa a perna dele para você enquanto você gira.', 'Termine com os dois ganchos antes de atacar.'],
      mistakes: ['Girar sem derrubar o oponente primeiro.', 'Perder o controle do cinto no meio do giro e virar leg drag.', 'Inverter com o pescoço sem preparo físico (proteja a coluna).'],
      concept: { text: 'Costas são a melhor posição do jiu-jitsu. Qualquer raspagem que termine nas costas vale mais que a que termina em cima da guarda.', source: 'Sistema de ataques às costas' },
      related: ['de-la-riva', 'controle-costas', 'mata-leao', 'raspagem-gancho'] },

    /* ===== PASSAGENS ===== */
    { id: 'conceito-passagem', cat: 'passagem', name: 'Como passar guarda: conceitos', alt: 'Hips first, head second', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Postura, controle das pernas, controle do quadril, controle da cabeça, estabilização.',
      idea: 'Passar guarda não é um golpe, é uma sequência. Primeiro você desconecta as pernas dele do seu corpo. Depois controla o quadril, que é o motor da guarda. Só então busca a cabeça e estabiliza. Pular etapas é a razão da maioria das passagens que falham.',
      steps: ['Postura: fique em posição de força, joelhos flexionados, cotovelos dentro, sem inclinar o tronco.', 'Anule os pés dele: tire os ganchos, o pé do quadril, o pé do bíceps.', 'Controle o quadril: pin da perna de baixo ou pressão com o corpo.', 'Controle a cabeça: crossface ou underhook depois que o quadril estiver preso.', 'Estabilize: cem quilos, joelho na barriga ou montada. Só conta passagem quando ele para de se mover.'],
      details: ['Quadril antes da cabeça, sempre.', 'Movimento vence força: use ângulos e mudanças de direção.', 'Quem se apressa para a cabeça é raspado ou entra em triângulo.'],
      mistakes: ['Ir direto na cabeça com as pernas dele ainda ativas.', 'Passar e não estabilizar.', 'Ficar parado na frente da guarda.'],
      concept: { text: 'Método NAC: Negar (os pés e as conexões), Avançar (sobre as pernas e o quadril) e Completar (cabeça e estabilização). Hips first, head second.', source: 'Fundamentos de passagem de guarda' },
      related: ['knee-cut', 'toreando', 'leg-drag', 'over-under', 'body-lock'] },

    { id: 'knee-cut', cat: 'passagem', name: 'Passagem de joelho (knee cut)', alt: 'Knee slice', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Você corta a guarda com o joelho por cima da coxa dele, com underhook e cabeça baixa.',
      idea: 'A passagem mais usada no mundo. Você coloca a canela sobre a coxa dele, garante o underhook (ou controle da gola) do mesmo lado e desliza o joelho até o tatame, deixando a perna dele para trás.',
      steps: ['Da meia guarda ou da guarda aberta, encaixe o joelho por cima da coxa dele, pé no chão do lado de fora.', 'Underhook do mesmo lado do joelho que corta (ou controle a gola/nuca).', 'Com a outra mão, controle o braço ou a manga dele para impedir o underhook dele.', 'Deslize o joelho para o tatame em diagonal, cabeça baixa e pressão no ombro.', 'Libere a perna e caia em cem quilos, mantendo o crossface.'],
      details: ['A cabeça dele controlada impede que ele vire para você.', 'O pé de fora fica firme no chão: é ele quem dá a pressão.', 'Cuidado com o underhook dele: sem o seu underhook ou o controle do braço, você é raspado.'],
      mistakes: ['Cortar sem controlar o braço e tomar underhook e as costas.', 'Corpo alto e leve: ele recupera a meia guarda.', 'Joelho apontando reto em vez de cortar em diagonal.'],
      concept: { text: 'O knee cut é uma batalha de underhooks: o passador precisa vencer essa batalha antes de deslizar o joelho.', source: 'Fundamentos de passagem de guarda' },
      related: ['conceito-passagem', 'smash-pass', 'de-la-riva-reversa', 'cem-quilos'] },

    { id: 'toreando', cat: 'passagem', name: 'Passagem toreando', alt: 'Toreada / bullfighter pass', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Controle as pernas dele pelos joelhos, jogue para um lado e passe para o outro.',
      idea: 'Como um toureiro, você desvia as pernas do oponente e passa em volta delas. É uma passagem de movimento: velocidade, ângulo e mudança de direção substituem a pressão.',
      steps: ['Em pé, controle as duas pernas dele pelos joelhos ou pelas calças, braços esticados.', 'Puxe os joelhos dele para um lado e para baixo, empurrando as pernas para o tatame.', 'Dê o passo para o lado oposto, em direção à cabeça dele.', 'Coloque o joelho ou o quadril na barriga dele e a mão no ombro para prendê-lo.', 'Estabilize em joelho na barriga ou cem quilos.'],
      details: ['Braços esticados mantêm distância dos ganchos.', 'Passe pela linha do quadril dele, não em círculo largo.', 'Troque de lado se ele acompanhar: a segunda direção é a que passa.'],
      mistakes: ['Ficar perto demais e levar gancho borboleta.', 'Passar e não pinçar o tronco com a mão no ombro.', 'Jogar as pernas mas não mover os pés.'],
      concept: { text: 'Toreando é uma passagem de negação: você nega as pernas e avança quando ele está fora do timing. Funciona muito com variações de leg drag e long step.', source: 'Fundamentos de passagem de guarda' },
      related: ['conceito-passagem', 'leg-drag', 'long-step', 'joelho-na-barriga'] },

    { id: 'leg-drag', cat: 'passagem', name: 'Leg drag', alt: 'Arrasto de perna', level: 'Azul', style: 'Gi e No-Gi',
      summary: 'Você puxa uma perna dele cruzada sobre o seu quadril e prende o quadril dele de lado.',
      idea: 'Arrastando a perna dele para o lado oposto, você vira o quadril dele e desliga a guarda. Da posição de leg drag, você passa para cem quilos, para as costas ou para a montada.',
      steps: ['Controle o tornozelo e o joelho de uma perna dele.', 'Puxe a perna cruzando sobre o seu quadril (a perna dele fica presa entre o seu quadril e o seu braço).', 'Encoste o quadril na coxa dele e controle o ombro oposto com a mão.', 'Pressione para baixo: o quadril dele fica virado para o lado, sem guarda.', 'Passe para cem quilos, ou se ele virar, pegue as costas.'],
      details: ['A perna dele é presa pela sua coxa e pelo seu cotovelo, não só pela mão.', 'Ombro oposto controlado impede que ele vire para você.', 'Se ele der as costas, siga.'],
      mistakes: ['Arrastar e não colar o quadril.', 'Soltar a perna antes de controlar o tronco.', 'Deixar o joelho dele voltar para dentro.'],
      concept: { text: 'A posição de leg drag é um "quase-passou" que vale ouro: o oponente está de lado, com o quadril morto, e você escolhe para onde ir.', source: 'Fundamentos de passagem de guarda' },
      related: ['toreando', 'conceito-passagem', 'controle-costas', 'cem-quilos'] },

    { id: 'over-under', cat: 'passagem', name: 'Passagem over-under', alt: 'Passagem de pressão', level: 'Azul', style: 'Gi e No-Gi',
      summary: 'Um braço por cima de uma perna, outro por baixo da outra. Pressão de ombro e caminhada.',
      idea: 'Você abraça uma perna por baixo e prende a outra por cima, concentrando peso no quadril dele. É a passagem de pressão por excelência: lenta, pesada e difícil de parar.',
      steps: ['Da guarda aberta, abrace uma perna dele por baixo, mão pegando a calça ou o cinto.', 'Com o outro braço, passe por cima da outra coxa e controle a calça ou o quadril.', 'Coloque o ombro no quadril ou na barriga dele, cabeça baixa do lado da perna abraçada.', 'Caminhe com os pés para o lado da perna abraçada, com o peso à frente.', 'Quando a perna liberar, deslize para cem quilos.'],
      details: ['Quadris baixos e pés fora do alcance dos ganchos.', 'A cabeça fica do lado da perna abraçada para evitar o triângulo.', 'Pressão para frente constante.'],
      mistakes: ['Subir o quadril e dar espaço para ele recuperar.', 'Deixar a cabeça do lado errado e levar triângulo.', 'Parar de caminhar.'],
      concept: { text: 'Passagens de pressão dependem de uma regra: o peso do seu corpo deve ficar sempre sobre o quadril dele, nunca sobre as pernas.', source: 'Fundamentos de passagem de guarda' },
      related: ['double-under', 'smash-pass', 'conceito-passagem', 'cem-quilos'] },

    { id: 'double-under', cat: 'passagem', name: 'Passagem de empilhada (double under)', alt: 'Stack pass', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Dois braços por baixo das pernas, você empilha o oponente sobre o pescoço dele e passa.',
      idea: 'Abraçando as duas pernas por baixo e levando o quadril dele para cima, você tira todo o poder das pernas. Depois passa para um lado com o ombro na coxa dele.',
      steps: ['Da guarda aberta, mergulhe os dois braços por baixo das coxas dele e pegue a gola ou o cinto.', 'Levante o quadril dele, empilhando-o sobre os ombros dele, com o seu peito nas coxas dele.', 'Escolha um lado: coloque o ombro na coxa dele e caminhe para esse lado.', 'Deixe a perna dele escorregar para o seu ombro e depois para o chão.', 'Caia em cem quilos ou monte.'],
      details: ['Quadril baixo antes de levantar: você levanta com as pernas.', 'A gola ou o cinto impedem que ele saia rolando para trás.', 'Cuidado com o triângulo: mantenha a cabeça longe das pernas soltas.'],
      mistakes: ['Braços abertos, sem juntar as pernas dele.', 'Levantar com as costas.', 'Ficar parado na empilhada sem ir para um lado.'],
      concept: { text: 'Empilhar é o antídoto para guardas ativas: com o quadril virado para cima, o oponente perde a mobilidade e você controla o ritmo.', source: 'Fundamentos de passagem' },
      related: ['over-under', 'conceito-passagem', 'cem-quilos', 'montada'] },

    { id: 'long-step', cat: 'passagem', name: 'Passagem long step', alt: 'Passo longo', level: 'Azul', style: 'Gi e No-Gi',
      summary: 'Você troca a direção da passagem com um passo longo para trás, saindo dos ganchos.',
      idea: 'Quando o oponente coloca o gancho ou a perna no seu quadril durante a passagem, você dá um passo longo para trás e para o lado oposto, esticando o corpo e caindo com o quadril no tatame ao lado dele.',
      steps: ['De uma posição de meia guarda ou toreando, controle o ombro dele do lado oposto ao gancho.', 'Dê um passo longo para trás com a perna do lado do gancho, esticando a perna para longe.', 'Deixe o quadril cair no tatame ao lado dele, peito virado para ele.', 'Estabilize com o braço na cabeça ou no quadril dele.', 'Ajuste para cem quilos ou joelho na barriga.'],
      details: ['O passo é longo e baixo: quadril quase no chão.', 'O braço de cima controla o ombro para ele não te seguir.', 'Ótimo quando ele acompanha o toreando com a perna.'],
      mistakes: ['Passo curto que não sai do gancho.', 'Cair de costas em vez de com o peito voltado para ele.', 'Soltar o controle do tronco.'],
      concept: { text: 'Movimento vence resistência: se ele empurra você com a perna, não resista, use o empurrão para mudar de direção.', source: 'Fundamentos de passagem de guarda' },
      related: ['toreando', 'leg-drag', 'conceito-passagem'] },

    { id: 'smash-pass', cat: 'passagem', name: 'Passagem de meia guarda (smash)', alt: 'Half guard smash pass', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Crossface, underhook e o joelho da meia guarda esmagado até você liberar a perna.',
      idea: 'A passagem de meia guarda começa antes de mexer a perna: você precisa de crossface e underhook para deitar o oponente reto. Sem mobilidade de quadril ele não consegue recuperar, e você libera a perna com calma.',
      steps: ['Da meia guarda por cima, garanta o crossface: ombro no queixo dele, virando a cabeça para longe.', 'Consiga o underhook do outro lado, mão apoiada no tatame ou pegando o ombro dele.', 'Deite o oponente reto, quadril pesado sobre o dele.', 'Empurre o joelho dele para baixo com a sua perna livre ou com a mão, e puxe a perna presa.', 'Libere a perna e caia em cem quilos ou monte.'],
      details: ['Crossface primeiro. Sem ele, ele vira para você e recupera.', 'Quadril baixo, peso no quadril dele.', 'Paciência: a perna sai com o tempo, não com força.'],
      mistakes: ['Puxar a perna antes de controlar o tronco.', 'Deixar o underhook dele e ser raspado.', 'Quadril alto e leve.'],
      concept: { text: 'A regra dos pins dinâmicos: controle a cabeça e o quadril, e a perna presa vira detalhe. O crossface é o rei da meia guarda por cima.', source: 'Fundamentos de passagem de meia guarda' },
      related: ['meia-guarda', 'knee-cut', 'cem-quilos', 'montada'] },

    { id: 'body-lock', cat: 'passagem', name: 'Passagem body lock', alt: 'Bodylock pass', level: 'Azul', style: 'No-Gi',
      summary: 'Abrace o tronco dele por cima da guarda, cole o peito e caminhe até o quadril passar.',
      idea: 'Passagem que dominou o sem kimono moderno: você abraça o tronco do oponente com as mãos travadas nas costas dele, cola o peito e usa o corpo todo para deitá-lo e desligar as pernas.',
      steps: ['Da guarda sentada ou meia guarda, entre com os braços em volta do tronco dele, mãos travadas na lombar.', 'Cole o peito no peito dele e leve o peso para frente até ele deitar.', 'Coloque a cabeça de um lado e caminhe o quadril para o outro lado da guarda dele.', 'Passe o joelho de dentro por cima da coxa dele ou desligue a perna com o quadril.', 'Solte o abraço só quando estiver em cem quilos.'],
      details: ['Mãos travadas baixo, na lombar, não nas costelas.', 'Quadril baixo e pesado.', 'A cabeça sempre do lado oposto ao que você está passando.'],
      mistakes: ['Body lock alto, ele senta e escapa.', 'Soltar as mãos cedo.', 'Empurrar com os braços em vez de com o corpo.'],
      concept: { text: 'Um passador precisa cobrir dois modos, movimento e pressão. O body lock é a versão máxima da pressão.', source: 'Fundamentos de passagem sem kimono' },
      related: ['over-under', 'smash-pass', 'conceito-passagem'] },

    /* ===== FINALIZAÇÕES ===== */
    { id: 'armlock', cat: 'finalizacao', name: 'Armlock da guarda', alt: 'Juji gatame / armbar', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Braço dele preso entre suas pernas, quadril levantado, polegar para cima.',
      idea: 'A chave de cotovelo mais clássica do jiu-jitsu. Você controla o braço estendido, gira o quadril para ficar perpendicular, passa a perna sobre a cabeça e levanta o quadril, hiperestendendo o cotovelo.',
      steps: ['Da guarda fechada, controle o punho e o cotovelo de um braço dele.', 'Coloque o pé do lado oposto no quadril dele e gire, abrindo ângulo de 90 graus.', 'Puxe o cotovelo dele além da linha do seu quadril e suba a perna sobre o ombro dele.', 'Passe a outra perna sobre a cabeça dele, joelhos apertados.', 'Polegar dele para cima, levante o quadril e estenda. Ele bate ou o braço vai.'],
      details: ['Joelhos juntos travam o braço.', 'Quadril colado na axila dele.', 'O ângulo é tudo: sem sair da linha frontal, não há armlock.'],
      mistakes: ['Tentar do centro, sem girar.', 'Joelhos abertos: ele puxa o braço.', 'Soltar o punho quando ele estica o braço para defender.'],
      concept: { text: 'O armlock é sobre controle antes da finalização: quadril colado, joelhos juntos e a cabeça dele presa. Depois a finalização é só levantar.', source: 'Sistema de armlock' },
      related: ['guarda-fechada', 'pendulo', 'triangulo', 'omoplata'] },

    { id: 'triangulo', cat: 'finalizacao', name: 'Triângulo', alt: 'Sankaku jime', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Estrangulamento com as pernas: cabeça e um braço dele dentro, o outro fora.',
      idea: 'A finalização mais versátil da guarda. Uma coxa pressiona uma carótida e o ombro do próprio oponente pressiona a outra. Ângulo e controle da cabeça resolvem quase todos os problemas de triângulo.',
      steps: ['Da guarda fechada, controle um punho e empurre-o para dentro, afastando o outro braço.', 'Leve uma perna sobre o ombro do braço de fora e a canela na nuca dele.', 'Controle a cabeça puxando a nuca para baixo.', 'Gire para o lado do braço preso para abrir ângulo (o seu corpo fica perpendicular).', 'Trave o pé atrás do joelho da outra perna, aperte os joelhos e puxe a cabeça.'],
      details: ['Só a cabeça e um braço dentro: se o ombro entrar demais, não aperta.', 'Ângulo primeiro, trava depois.', 'O braço de dentro dele cruzado no peito acelera o estrangulamento.'],
      mistakes: ['Travar o triângulo de frente, sem ângulo.', 'Puxar a cabeça antes de controlar o braço dele.', 'Tentar apertar só com as coxas, sem elevar o quadril.'],
      concept: { text: 'Todos os problemas do triângulo se curam com ângulo. Controle a cabeça, gire perpendicular, depois trave.', source: 'Sistema de triângulos' },
      related: ['guarda-fechada', 'armlock', 'omoplata', 'aranha'] },

    { id: 'omoplata', cat: 'finalizacao', name: 'Omoplata', alt: 'Chave de ombro com a perna', level: 'Azul', style: 'Gi e No-Gi',
      summary: 'Sua perna passa sobre o braço dele e o ombro é forçado. Também raspa.',
      idea: 'Você enrola o braço dele com a perna, senta e usa o peso do corpo para girar o ombro dele. Se ele rolar para fugir, você vem por cima. É finalização, raspagem e posição de controle ao mesmo tempo.',
      steps: ['Da guarda fechada ou aranha, controle o braço dele que está do lado que você vai atacar.', 'Passe a perna sobre o ombro dele, canela na nuca, e gire o corpo para sentar de lado.', 'Enrole o braço dele com a perna, pé por baixo do tronco, e trave a perna com a outra.', 'Controle o quadril ou o cinto dele com o braço para ele não rolar.', 'Sente, incline o tronco para frente e leve o braço dele para trás.'],
      details: ['Controle do quadril dele impede a fuga rolando.', 'Você precisa sentar completamente: deitado não finaliza.', 'Braço dele preso na altura do cotovelo, não do punho.'],
      mistakes: ['Deixar ele levantar a postura antes de sentar.', 'Soltar o controle do quadril e ele rola por cima.', 'Perna solta sem travar.'],
      concept: { text: 'Omoplata, triângulo e armlock formam o trio de ataques da guarda: os três nascem do mesmo controle de braço e mudam conforme a defesa.', source: 'Sistema clássico de guarda fechada' },
      related: ['guarda-fechada', 'triangulo', 'aranha', 'lasso'] },

    { id: 'kimura', cat: 'finalizacao', name: 'Kimura', alt: 'Ude garami (reverso)', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Chave de ombro em figura quatro, torcendo o braço para trás das costas dele.',
      idea: 'Você trava o punho dele e passa a mão pelo braço formando um 4. O ombro é torcido para trás. A kimura é também uma posição de controle (kimura trap) que abre raspagens, tomadas de costas e passagens.',
      steps: ['Da guarda fechada (com ele apoiando a mão) ou do cem quilos, segure o punho dele com a mão do mesmo lado.', 'Passe o outro braço por cima do braço dele e segure o próprio punho: figura quatro.', 'Puxe o cotovelo dele para o seu peito e o punho dele para as costas.', 'Da guarda: vire de lado e trave a perna por cima das costas dele para impedir rolagem.', 'Leve a mão dele em direção à nuca, devagar.'],
      details: ['Cotovelo dele colado no seu corpo.', 'A finalização vem do ângulo do ombro, não da força dos braços.', 'Punho dele longe do corpo dele: se ele segura o cinto ou a perna, você muda de ataque.'],
      mistakes: ['Deixar o cotovelo dele longe do corpo.', 'Forçar rápido demais: o ombro machuca sem aviso.', 'Não travar a perna nas costas dele da guarda, e ele rola.'],
      concept: { text: 'A "trindade de poder" da kimura: quanto as pernas participam, quanto a cabeça dele está controlada e quanto o ombro dele está controlado. Sem os três, a kimura é fraca.', source: 'Sistema de kimura' },
      related: ['hip-bump', 'americana', 'cem-quilos', 'guilhotina'] },

    { id: 'americana', cat: 'finalizacao', name: 'Americana', alt: 'Ude garami / keylock', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Chave de ombro em figura quatro com o braço dele para cima, feita do cem quilos ou da montada.',
      idea: 'Você prende o punho dele no tatame, passa o outro braço por baixo do cotovelo dele e arrasta o cotovelo para baixo enquanto levanta o punho. É a irmã da kimura no sentido oposto.',
      steps: ['Do cem quilos, coloque o braço dele no chão com o cotovelo dobrado em 90 graus, punho para cima.', 'Prenda o punho dele no tatame com a mão do lado da cabeça.', 'Passe o outro braço por baixo do cotovelo dele e segure o seu próprio punho.', 'Mantenha o peito pesado no peito dele.', 'Arraste o cotovelo dele em direção ao quadril dele, como pintar o chão, e levante o punho.'],
      details: ['Punho dele sempre encostado no tatame.', 'O movimento é arrastar o cotovelo, não empurrar o punho.', 'Pressão do peito impede que ele vire.'],
      mistakes: ['Deixar o cotovelo dele acima da linha do ombro.', 'Levantar o corpo e dar espaço.', 'Forçar com o braço e não com o corpo.'],
      concept: { text: 'Finalizações por cima seguem a lógica de pin: primeiro o oponente para de se mexer, depois você ataca.', source: 'Fundamentos de posição por cima' },
      related: ['kimura', 'cem-quilos', 'montada', 'armlock'] },

    { id: 'estrangulamento-cruzado', cat: 'finalizacao', name: 'Estrangulamento cruzado (gola)', alt: 'Cross collar choke', level: 'Branca', style: 'Gi',
      summary: 'Duas mãos fundas nas golas, cruzadas, cotovelos fechando. O clássico do kimono.',
      idea: 'Você entra com uma mão bem fundo na gola dele, palma para cima, e a outra mão na outra gola (ou por cima). Puxando os cotovelos para baixo e girando os punhos, os punhos pressionam as carótidas.',
      steps: ['Da guarda fechada ou da montada, abra a gola dele com uma mão e entre com a outra mão bem fundo, palma para cima, até a nuca.', 'Quebre a postura dele puxando com a mão da gola.', 'A segunda mão entra na outra gola por baixo ou por cima, também fundo.', 'Traga os cotovelos para o seu corpo e gire os punhos, colando os antebraços no pescoço.', 'Puxe a cabeça dele em direção ao seu peito.'],
      details: ['A primeira mão precisa chegar até a nuca.', 'Cotovelos para dentro e para baixo, não para fora.', 'Da guarda, use as pernas para quebrar a postura antes.'],
      mistakes: ['Mãos rasas na gola.', 'Abrir os cotovelos e perder a pressão.', 'Usar força de braço e cansar.'],
      concept: { text: 'Estrangulamentos de gola funcionam com posição dos punhos, não com força: entre fundo primeiro, ajuste o ângulo depois.', source: 'Fundamentos de kimono' },
      related: ['guarda-fechada', 'montada', 'tesoura', 'ezequiel'] },

    { id: 'ezequiel', cat: 'finalizacao', name: 'Ezequiel', alt: 'Sode guruma jime', level: 'Azul', style: 'Gi',
      summary: 'Braço em volta da cabeça, mão dentro da própria manga, o outro antebraço corta o pescoço.',
      idea: 'Nomeado em homenagem ao judoca Ezequiel Paraguassu, é um estrangulamento feito com a própria manga. Comum da montada, também sai da guarda fechada e da meia guarda por cima.',
      steps: ['Da montada, passe um braço por baixo da nuca dele, cotovelo apoiado no tatame.', 'Com a mão livre, entre com quatro dedos dentro da manga do braço que abraça a nuca, bem fundo, na altura do punho.', 'Passe a mão do braço que abraça a nuca cruzada sobre o pescoço dele: o dorso da mão e o antebraço cortam de lado.', 'Puxe a manga com uma mão e estenda o outro braço, fechando os cotovelos.', 'Peso à frente e base larga para não ser raspado.'],
      details: ['Mão fundo na manga, no punho, não nos dedos.', 'O antebraço cruzado deve entrar de lado, não por cima do queixo.', 'Base larga na montada para não ser virado.'],
      mistakes: ['Base estreita e ser raspado.', 'Pegar a manga de forma rasa.', 'Tentar sem quebrar a defesa das mãos dele.'],
      concept: { text: 'Estrangulamentos que não dependem da gola do oponente são mais difíceis de defender: ele não sabe de onde vem.', source: 'Fundamentos de kimono' },
      related: ['montada', 'estrangulamento-cruzado', 'katagatame'] },

    { id: 'mata-leao', cat: 'finalizacao', name: 'Mata-leão', alt: 'Rear naked choke', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Das costas: braço em volta do pescoço, cotovelo sob o queixo, figura quatro atrás da cabeça.',
      idea: 'A finalização mais eficiente do jiu-jitsu. O bíceps de um lado e o antebraço do outro fecham as duas carótidas. O segundo braço apenas trava, por trás da cabeça. Vence-se a defesa das mãos antes, com o hand fight.',
      steps: ['Do controle das costas, com o cinto de segurança, vença a briga de mãos: prenda um braço dele e libere o seu braço estrangulador.', 'Passe o braço por baixo do queixo dele, cotovelo alinhado com o queixo.', 'Coloque a mão estranguladora no seu próprio bíceps e a outra mão atrás da cabeça dele.', 'Expanda o peito, retraia os cotovelos e leve a cabeça dele para frente com o antebraço.', 'Segure sem apertar a traqueia: o estrangulamento é nas laterais.'],
      details: ['Cotovelo abaixo do queixo, centralizado.', 'A segunda mão fica escondida atrás da cabeça dele, fora do alcance.', 'Peito colado nas costas dele, sem espaço.'],
      mistakes: ['Braço por cima do queixo: vira esmagamento de rosto, não estrangula.', 'Cruzar as pernas em cima do oponente e levar chave de pé.', 'Tentar antes de vencer a briga de mãos.'],
      concept: { text: 'No sistema straitjacket, você prende um braço dele com a sua perna (ou com a mão) e faz "dois contra um" no braço livre. Sem defesa, o mata-leão é inevitável.', source: 'Sistema de ataques às costas' },
      related: ['controle-costas', 'katagatame', 'escape-costas', 'berimbolo'] },

    { id: 'guilhotina', cat: 'finalizacao', name: 'Guilhotina', alt: 'Guillotine', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Antebraço no pescoço dele por baixo do queixo, com a cabeça dele presa sob a sua axila.',
      idea: 'Do front headlock ou da guarda, você enrola o pescoço dele e finaliza puxando o punho para cima enquanto estende o quadril. As variações mais fortes são a de cotovelo alto (high elbow) e a com o braço dentro (arm-in).',
      steps: ['Do front headlock (ele de quatro ou na sua guarda), passe o braço em volta do pescoço, lâmina do antebraço sob o queixo.', 'Segure o punho estrangulador com a outra mão (guilhotina simples) ou passe o outro braço sobre o ombro dele (high elbow).', 'Cole o quadril na cabeça dele: sem espaço entre o seu tronco e o pescoço dele.', 'Da guarda: feche a guarda ou meia guarda para impedir que ele passe para o lado do braço.', 'Puxe o punho para cima e para o seu peito, estendendo o quadril para frente.'],
      details: ['Lâmina do antebraço, não o cotovelo, na garganta.', 'Cabeça dele presa embaixo da axila, com o seu peito sobre ela.', 'Ele vai tentar passar para o lado do braço estrangulador: sua perna impede.'],
      mistakes: ['Braço em volta da cabeça em vez do pescoço.', 'Deixar espaço entre o quadril e a cabeça dele.', 'Deitar reto e ele passa para o lado.'],
      concept: { text: 'Guilhotina, anaconda e darce são um sistema só: a defesa de uma abre a outra. Parta do front headlock e escolha pela reação do oponente.', source: 'Sistema de front headlock' },
      related: ['front-headlock', 'darce', 'anaconda', 'hip-bump'] },

    { id: 'darce', cat: 'finalizacao', name: "D'Arce", alt: 'Brabo choke', level: 'Roxa', style: 'Gi e No-Gi',
      summary: 'Estrangulamento em figura quatro: seu braço entra por baixo da axila dele e sai atrás do pescoço.',
      idea: "Do front headlock ou da meia guarda por cima, você passa o braço por baixo do braço dele e ao redor do pescoço, travando com o outro braço em figura quatro. Comprime a carótida usando o próprio ombro dele.",
      steps: ['Do front headlock ou de quando ele dá o underhook errado, entre com o braço por baixo da axila dele até a nuca.', 'Passe a mão pelo lado do pescoço e agarre o seu próprio bíceps do outro braço.', 'A mão do outro braço vai atrás da cabeça dele: figura quatro.', 'Feche o cotovelo do braço que passa e aperte o braço dele contra o pescoço dele.', 'Deite para o lado da cabeça dele (sprawl) e comprima com o peito.'],
      details: ["A mão precisa passar fundo: até a nuca dele.", 'O ombro dele é quem fecha um lado do estrangulamento.', 'Peito pesado na cabeça dele.'],
      mistakes: ['Braço raso: ele tira a cabeça.', 'Tentar do lado errado (a darce vai pelo braço mais próximo).', 'Apertar com os braços e não com o corpo.'],
      concept: { text: 'Reação do oponente decide: se ele defende a guilhotina levando a cabeça para fora, a darce aparece do outro lado.', source: 'Sistema de front headlock' },
      related: ['front-headlock', 'guilhotina', 'anaconda', 'katagatame'] },

    { id: 'anaconda', cat: 'finalizacao', name: 'Anaconda', alt: 'Estrangulamento anaconda', level: 'Roxa', style: 'Gi e No-Gi',
      summary: 'Do front headlock: braço passa pelo pescoço e sai por baixo da axila dele. Depois, o rolamento.',
      idea: 'Espelho da darce. Seu braço entra pelo pescoço e sai por baixo da axila, travando em figura quatro. Você rola para o lado do braço preso (gator roll) e comprime.',
      steps: ['Do front headlock, com ele de quatro, controle o queixo e a axila.', 'Entre com o braço pelo pescoço e saia por baixo da axila do braço mais próximo.', 'Agarre o seu próprio bíceps e coloque a mão do outro braço atrás do braço dele.', 'Role em direção ao braço preso, levando-o por cima de você.', 'Ao terminar o rolamento, feche os cotovelos e caminhe com as pernas em direção à cabeça dele.'],
      details: ['A mão que entra precisa chegar fundo, além da axila.', 'Rolar para o lado certo: o do braço preso.', 'Depois de rolar, cotovelos juntos e pressão do peito.'],
      mistakes: ['Braço raso.', 'Rolar para o lado errado.', 'Não caminhar as pernas depois do rolamento.'],
      concept: { text: 'Anaconda de um lado, darce do outro e guilhotina no meio: essa é a árvore de decisões do front headlock.', source: 'Sistema de front headlock' },
      related: ['front-headlock', 'darce', 'guilhotina'] },

    { id: 'katagatame', cat: 'finalizacao', name: 'Katagatame (arm triangle)', alt: 'Triângulo de braço', level: 'Azul', style: 'Gi e No-Gi',
      summary: 'Da montada ou do cem quilos: cabeça e um braço dele presos pelo seu braço e o seu ombro.',
      idea: 'Você prende a cabeça e um braço dele com o seu braço, cola o seu ombro no pescoço e o braço dele fecha o outro lado. Sai da montada com facilidade e é a finalização principal do sistema 4x4 de montada.',
      steps: ['Da montada, leve um braço dele para cima e por cima da cabeça dele.', 'Passe o seu braço por baixo do pescoço dele, do lado onde está o braço dele.', 'Encoste a sua cabeça no tatame do outro lado, prendendo o braço dele contra o pescoço dele.', 'Saia da montada para o lado do estrangulamento, pernas esticadas, e trave as mãos (palma sobre bíceps).', 'Aperte os cotovelos e leve o quadril para frente, compressão gradual.'],
      details: ['O braço dele precisa cruzar a linha central do pescoço dele.', 'Você sai da montada para o mesmo lado do braço preso.', 'Cabeça baixa e pesada, não elevada.'],
      mistakes: ['Ficar na montada e tentar apertar: sem ângulo não fecha.', 'Braço dele com o cotovelo fora da linha do pescoço.', 'Apertar antes de estabilizar o corpo.'],
      concept: { text: 'Sistema 4x4 da montada: underhook, linha do cotovelo, grips de controle e um dos quatro finais (arm triangle, armlock, triângulo ou costas). O katagatame é o primeiro deles.', source: 'Sistema de ataques da montada' },
      related: ['montada', 'darce', 'mata-leao', 'armlock-montada'] },

    { id: 'armlock-montada', cat: 'finalizacao', name: 'Armlock da montada', alt: 'Armbar from mount', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Da montada alta: isole um braço, gire e caia para trás com o cotovelo dele preso.',
      idea: 'Quando o oponente empurra o seu peito da montada, os braços dele viram alvo. Você sobe para a montada alta, gira o corpo e cai para trás com a perna por cima da cabeça dele.',
      steps: ['Da montada, suba os joelhos para as axilas dele (montada alta).', 'Isole um braço: controle o cotovelo e o punho contra o seu peito.', 'Coloque a mão do outro lado no tatame, levante o quadril e gire o joelho para a cabeça dele.', 'Passe a perna por cima da cabeça, sente perto do ombro dele e caia para trás.', 'Joelhos apertados, polegar para cima, quadril levanta.'],
      details: ['Quadril colado no ombro dele: espaço é fuga.', 'Perna sobre a cabeça pesada, impedindo que ele sente.', 'Não caia longe: caia perto do ombro.'],
      mistakes: ['Cair para trás antes de prender o braço.', 'Espaço entre o seu quadril e o ombro dele.', 'Soltar o punho na queda.'],
      concept: { text: 'Na montada, o braço que empurra você é o braço que vai ser finalizado. É a "linha do cotovelo": levou o cotovelo dele para cima, o ataque está pronto.', source: 'Sistema de ataques da montada' },
      related: ['montada', 'katagatame', 'armlock', 'escape-montada'] },

    { id: 'relogio', cat: 'finalizacao', name: 'Relógio', alt: 'Clock choke', level: 'Azul', style: 'Gi',
      summary: 'Com ele de quatro: mão fundo na gola, seu peso na cabeça e você caminha como ponteiro de relógio.',
      idea: 'Quando o oponente fica de quatro, você entra com a mão na gola por trás e usa o peso do corpo para fechar o estrangulamento, caminhando em volta da cabeça dele.',
      steps: ['Com ele de quatro, posicione-se do lado, joelho perto do quadril dele.', 'Entre com a mão de cima bem fundo na gola dele, palma para baixo.', 'Com a outra mão, controle o braço dele por baixo (ou a manga) para impedir que ele role.', 'Deite o peso na cabeça e nos ombros dele.', 'Caminhe com as pernas em direção à cabeça dele, como os ponteiros de um relógio, mantendo a gola.'],
      details: ['A gola precisa estar funda e o antebraço no pescoço.', 'Peso na cabeça dele, não nas costas.', 'A caminhada faz o aperto, não o braço.'],
      mistakes: ['Ficar em pé e deixar ele rolar.', 'Gola rasa.', 'Puxar com o braço em vez de caminhar.'],
      concept: { text: 'Contra o casco, a lógica é a mesma das costas: controle antes da finalização. Prenda um braço, tire a mobilidade, e depois ataque.', source: 'Fundamentos de kimono' },
      related: ['controle-costas', 'estrangulamento-cruzado', 'escape-casco'] },

    { id: 'chave-de-pe', cat: 'finalizacao', name: 'Chave de pé reta', alt: 'Straight ankle lock / Achilles lock', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Do ashi garami: tendão de Aquiles sobre o seu antebraço, quadril para frente e peito para cima.',
      idea: 'A única chave de perna permitida para todas as faixas em muitas regras. Você prende o pé dele debaixo da axila, coloca o osso do antebraço no tendão de Aquiles e estende o quadril, hiperflexionando o tornozelo.',
      steps: ['Do single leg X, prenda o pé dele debaixo da axila, calcanhar na sua costela.', 'Coloque a lâmina do antebraço (osso) contra o tendão de Aquiles.', 'Trave a mão no seu próprio antebraço ou peito.', 'Pé de fora no quadril dele para mantê-lo longe, joelho de dentro por dentro.', 'Deite de lado (em direção ao dedão dele), leve o quadril para frente e o peito para trás.'],
      details: ['O calcanhar dele fica preso na sua axila; se o pé escapa para o lado, a chave acaba.', 'Deite de lado, na direção do dedinho dele, não reto.', 'Quadril para frente, não puxão de braço.'],
      mistakes: ['Puxar com os braços e cansar.', 'Deixar o joelho dele passar da sua linha (ele senta e escapa).', 'Pé dele solto embaixo do braço.'],
      concept: { text: 'O ashi garami controla a perna acima e abaixo do joelho. A finalização só vem quando a posição está fechada.', source: 'Sistema de ataques às pernas' },
      related: ['single-leg-x', 'heel-hook', '50-50', 'guarda-x'] },

    { id: 'heel-hook', cat: 'finalizacao', name: 'Heel hook (chave de calcanhar)', alt: 'Inside heel hook', level: 'Marrom', style: 'No-Gi',
      summary: 'Do saddle ou do ashi de dentro: calcanhar dele no seu antebraço, rotação do joelho. Perigoso, treine só com supervisão.',
      idea: 'A finalização que redefiniu o jiu-jitsu sem kimono. Você controla o joelho dele com as pernas e gira o calcanhar, aplicando torção no joelho. Não avisa com dor: o parceiro precisa bater cedo, e você precisa soltar cedo. Legal em regras de sem kimono para faixas avançadas; ilegal no kimono.',
      steps: ['Do saddle (honey hole) ou do inside ashi, prenda a perna dele acima do joelho com as suas pernas.', 'Exponha o calcanhar: leve o pé dele para fora da linha do quadril dele.', 'Encaixe o calcanhar na dobra do seu punho ou do antebraço, mão travada no outro pulso ou bíceps.', 'Aperte os joelhos para impedir que o joelho dele gire junto.', 'Gire o tronco lentamente puxando o calcanhar para o seu peito e o pé dele para fora. Solte ao primeiro sinal de batida.'],
      details: ['Controle do joelho é tudo: sem prender a coxa acima do joelho, o oponente gira e escapa.', 'O calcanhar precisa estar exposto antes de girar.', 'Aplique devagar. Lesões de heel hook não avisam.'],
      mistakes: ['Aplicar rápido em treino.', 'Deixar o joelho dele girar junto com o calcanhar.', 'Tentar sem controle da posição.'],
      concept: { text: 'A hierarquia é posição, exposição do calcanhar, e só então quebra. E o princípio do "double trouble": a defesa vem da outra perna dele, controle-a também.', source: 'Sistema de ataques às pernas' },
      related: ['saddle', 'single-leg-x', '50-50', 'chave-de-pe'] },

    { id: 'toe-hold', cat: 'finalizacao', name: 'Chave de pé torcida (toe hold)', alt: 'Toe hold', level: 'Marrom', style: 'Gi e No-Gi',
      summary: 'Figura quatro no pé dele, torcendo para o lado, atacando tornozelo e joelho.',
      idea: 'Você segura o pé dele na altura dos dedos e passa a outra mão por baixo do tornozelo, formando um 4. Girando o pé em direção ao glúteo dele, força tornozelo e joelho. Permitida no kimono só de marrom para cima.',
      steps: ['Com a perna dele controlada (do 50/50, do ashi ou da meia guarda por cima), segure o pé dele pela parte de fora, dedos para baixo.', 'Passe a outra mão por baixo do tornozelo e agarre o seu próprio punho: figura quatro.', 'Controle o joelho dele com o corpo para ele não girar.', 'Leve o pé em direção ao glúteo dele, girando o tornozelo.', 'Aplique devagar: o joelho também sofre.'],
      details: ['A mão pega o pé no meio, não na ponta dos dedos.', 'O cotovelo da mão de baixo fecha o joelho dele.', 'Direção: o pé vai para o glúteo, não para o lado.'],
      mistakes: ['Aplicar rápido.', 'Não controlar o joelho dele e ele gira.', 'Pegar só os dedos.'],
      concept: { text: 'Chaves de perna são chaves de controle: sem prender o joelho, a finalização vira uma disputa de força, e o oponente escapa.', source: 'Sistema de ataques às pernas' },
      related: ['heel-hook', 'chave-de-pe', '50-50', 'saddle'] },

    /* ===== CONTROLES ===== */
    { id: 'montada', cat: 'controle', name: 'Montada', alt: 'Mount', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Sentado sobre o tronco dele, joelhos no chão. A posição mais valorizada por pontos.',
      idea: 'Da montada, você tem gravidade a favor e ele tem só as mãos. Manter a montada é questão de base e de ir para a montada alta. Atacar é questão de sistema: underhook, linha do cotovelo, controle e finalização.',
      steps: ['Joelhos no chão, pés enganchados por dentro das coxas dele ou pés abertos para base.', 'Mantenha o peso à frente quando ele tenta o upa, e o quadril baixo quando ele tenta a elbow escape.', 'Suba os joelhos para as axilas dele (montada alta) sempre que ele empurrar.', 'Ganhe o underhook de um lado e leve o cotovelo dele para cima da linha do ombro.', 'Ataque katagatame, armlock, triângulo montado ou costas conforme a reação.'],
      details: ['Montada alta reduz a força das pernas e dos braços dele.', 'Mãos livres: apoie no tatame quando ele tentar o upa.', 'Não persiga um só ataque; troque conforme a defesa.'],
      mistakes: ['Ficar baixo com os pés cruzados na montada baixa, sem atacar.', 'Apoiar as duas mãos e deixar ele fazer a elbow escape.', 'Forçar um estrangulamento de frente sem controle dos braços dele.'],
      concept: { text: 'Sistema 4x4: quatro passos (underhook, linha do cotovelo, grips, finalização) e quatro finais (arm triangle, armlock, triângulo, costas).', source: 'Sistema de ataques da montada' },
      related: ['katagatame', 'armlock-montada', 'ezequiel', 'escape-montada'] },

    { id: 'controle-costas', cat: 'controle', name: 'Controle das costas', alt: 'Back mount / cinto de segurança', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Dois ganchos e cinto de segurança (um braço por cima do ombro, outro por baixo da axila).',
      idea: 'A posição mais dominante do jiu-jitsu: você vê o oponente e ele não vê você. O cinto de segurança prende o tronco, os ganchos prendem o quadril. A briga de mãos decide o mata-leão.',
      steps: ['Cinto de segurança: um braço por cima do ombro, o outro por baixo da axila, mãos travadas no peito dele.', 'Dois ganchos por dentro das coxas dele, ou body triangle (pernas em triângulo em volta do tronco).', 'Fique do lado do braço que passa por baixo (lado do underhook), com a cabeça colada na dele.', 'Hand fight: prenda um braço dele com a perna ou com a mão, isole o outro.', 'Ataque o mata-leão quando o pescoço estiver descoberto.'],
      details: ['A cabeça do lado do underhook, não do lado do estrangulamento.', 'Ele vai tentar escorregar para o lado do braço de cima: seu gancho e o cinto impedem.', 'Sem pressa: controle e briga de mãos antes do pescoço.'],
      mistakes: ['Cruzar os pés na frente da barriga dele: chave de pé.', 'Perder o cinto de segurança para ir direto ao pescoço.', 'Deixar ele colocar os ombros no tatame.'],
      concept: { text: 'Straitjacket: prenda um braço dele com a perna (ou prenda o punho na coxa) e faça dois contra um no braço livre. Um oponente sem braços não defende o pescoço.', source: 'Sistema de ataques às costas' },
      related: ['mata-leao', 'escape-costas', 'berimbolo', 'katagatame'] },

    { id: 'cem-quilos', cat: 'controle', name: 'Cem quilos', alt: 'Side control', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'De lado sobre ele, peito no peito, crossface e controle do quadril.',
      idea: 'Você deita perpendicular ao oponente, com o peso no peito dele. O crossface vira a cabeça dele para longe e o outro braço bloqueia o quadril. Da posição, saem americana, kimura, joelho na barriga e montada.',
      steps: ['Peito colado no peito dele, quadril baixo, pernas em base (uma esticada, outra flexionada, ou joelhos apoiados).', 'Crossface: braço por baixo da cabeça dele, ombro no queixo, virando a cabeça para longe.', 'Outro braço por baixo do braço dele ou controlando o quadril.', 'Troque de base conforme ele se move: joelho no quadril, joelho na axila, joelho na barriga.', 'Quando ele dá espaço, monte ou ataque americana, kimura ou katagatame.'],
      details: ['Cabeça dele virada para longe: onde a cabeça vai, o corpo vai.', 'Quadril baixo e pesado, cotovelos fechados.', 'Não deixe ele pegar o underhook.'],
      mistakes: ['Quadril alto, ele coloca o joelho e recupera.', 'Deixar o braço dele por baixo (underhook).', 'Ficar parado sem transitar.'],
      concept: { text: 'Pins dinâmicos: você controla cabeça e quadril, e muda de posição conforme ele reage, em vez de tentar segurar tudo parado.', source: 'Fundamentos de controle por cima' },
      related: ['americana', 'kimura', 'joelho-na-barriga', 'escape-cem-quilos'] },

    { id: 'joelho-na-barriga', cat: 'controle', name: 'Joelho na barriga', alt: 'Knee on belly', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Joelho no abdômen dele, outra perna em base, gola e calça controladas.',
      idea: 'Posição de transição que pontua e força reações. O peso vai todo no joelho, a outra perna fica longe, esticada. Quando ele empurra o joelho, o braço dele fica exposto para armlock ou kimura.',
      steps: ['Do cem quilos ou do toreando, coloque o joelho na barriga dele, pé ao lado do quadril.', 'A outra perna fica esticada, pé longe, para dar base e distância.', 'Controle a gola (ou a nuca) com uma mão e a calça (ou o quadril) com a outra.', 'Peso para frente, no joelho, quadril alto e tronco ereto.', 'Se ele empurra o joelho com a mão, gire para armlock ou volte para o cem quilos do outro lado.'],
      details: ['Joelho no abdômen, não no peito ou no quadril.', 'Tronco ereto: se você se inclina, ele levanta o joelho.', 'Pé de base longe do alcance dele.'],
      mistakes: ['Colocar o joelho e deixar ele pegar o seu pé.', 'Inclinar o tronco para frente.', 'Ficar parado e ser raspado.'],
      concept: { text: 'Posições de controle são estações: você para nelas para pontuar e forçar reações, não para morar nelas.', source: 'Fundamentos de posição por cima' },
      related: ['cem-quilos', 'toreando', 'armlock', 'montada'] },

    { id: 'front-headlock', cat: 'controle', name: 'Front headlock', alt: 'Controle frontal da cabeça', level: 'Azul', style: 'Gi e No-Gi',
      summary: 'Ele de quatro ou agachado, você controla o queixo e a axila por cima. Porta de guilhotina, darce e anaconda.',
      idea: 'A posição onde acontece a maior parte das finalizações do sem kimono: sempre que uma raspagem ou uma passagem falha, alguém vira de quatro e o front headlock aparece. Controle primeiro (queixo e braço), depois escolha o estrangulamento.',
      steps: ['Com ele de quatro à sua frente, coloque o peito sobre os ombros dele, quadril baixo.', 'Uma mão controla o queixo (chin strap), a outra prende o braço dele pela axila ou pelo cotovelo.', 'Puxe o queixo dele para fora, arrancando a cabeça da linha das mãos dele.', 'Circule em volta para as costas se ele levantar; se ele der o braço, entre na darce ou anaconda; se ele tirar o braço, a guilhotina.', 'Mantenha os pés fora do alcance das mãos dele.'],
      details: ['Chin strap com o cotovelo fechado.', 'Quadril baixo e pesado sobre os ombros dele.', 'Nunca deixe ele pegar a sua perna.'],
      mistakes: ['Ficar em pé e alto: ele entra em single leg.', 'Segurar a cabeça sem controlar o braço.', 'Forçar um estrangulamento sem controle.'],
      concept: { text: 'Guilhotina, darce e anaconda não são três golpes, são um sistema. O oponente escolhe qual você vai fazer.', source: 'Sistema de front headlock' },
      related: ['guilhotina', 'darce', 'anaconda', 'controle-costas'] },

    { id: 'saddle', cat: 'controle', name: 'Saddle (honey hole / 411)', alt: 'Inside sankaku', level: 'Marrom', style: 'No-Gi',
      summary: 'Perna dele presa entre suas pernas em triângulo, com o joelho dele atravessando o seu corpo.',
      idea: 'A posição de controle mais forte do sistema de leg locks. Você fecha um triângulo de pernas em volta da coxa dele, o joelho dele fica preso e o calcanhar de dentro exposto. É o coração do sistema de pernas.',
      steps: ['Da guarda X, do single leg X ou de uma passagem que falhou, gire por baixo da perna dele para o lado de dentro.', 'Trave um triângulo com as pernas na coxa dele, acima do joelho.', 'Fique de lado, com o joelho dele atravessando a sua linha central e o pé dele saindo pelo seu quadril.', 'Controle a outra perna dele também (double trouble), com a mão ou com a sua perna.', 'Exponha o calcanhar de dentro para o heel hook ou transite para as costas se ele girar.'],
      details: ['O triângulo precisa estar acima do joelho dele.', 'Quadril virado para o oponente, nunca de costas no chão.', 'A perna livre dele é a que mais defende: controle-a.'],
      mistakes: ['Prender abaixo do joelho e deixar o joelho dele girar.', 'Deitar de costas e perder o ângulo.', 'Ignorar a perna livre.'],
      concept: { text: 'Princípio do double trouble: a maior parte da defesa a um leg lock vem da outra perna. Controle as duas, e a fuga acaba.', source: 'Sistema de ataques às pernas' },
      related: ['heel-hook', 'single-leg-x', '50-50', 'toe-hold'] },

    /* ===== ESCAPES ===== */
    { id: 'escape-montada', cat: 'escape', name: 'Fuga da montada', alt: 'Upa e elbow escape', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Upa (ponte e rolamento) e saída de cotovelo (joelho e cotovelo). As duas juntas resolvem quase tudo.',
      idea: 'Todo o sistema de escapes se reduz a dois princípios: fuga de joelho e fuga de cotovelo. Na montada, o upa vira o oponente se ele se apoia em você; a elbow escape recupera a guarda se ele afasta o peso.',
      steps: ['Frames primeiro: cotovelos fechados, mãos protegendo o pescoço, não empurre com os braços esticados.', 'Upa: prenda um braço e o pé dele do mesmo lado, faça a ponte alto sobre o ombro oposto e role para cima dele.', 'Elbow escape: vire de lado, coloque o cotovelo por dentro do joelho dele e empurre o joelho com o antebraço, puxando o seu joelho para fora.', 'Recupere meia guarda com o joelho, depois a guarda fechada ou borboleta.', 'Se ele bloquear uma, a outra abre: alterne.'],
      details: ['Ponte alta e em diagonal, sobre o ombro.', 'Joelho e cotovelo se encontram: essa é a barreira.', 'Quadril fora da linha antes de tentar puxar a perna.'],
      mistakes: ['Empurrar o peito dele com os braços esticados: armlock.', 'Fazer a ponte reta para cima.', 'Ficar de costas planas.'],
      concept: { text: 'Dois princípios, todas as posições: fuga de joelho e fuga de cotovelo. Escapes são o primeiro tema para iniciantes porque sobrevivência vem antes de tudo.', source: 'Fundamentos de escapes' },
      related: ['montada', 'escape-cem-quilos', 'retencao', 'meia-guarda'] },

    { id: 'escape-cem-quilos', cat: 'escape', name: 'Fuga do cem quilos', alt: 'Side control escape', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Frames no pescoço e no quadril, ponte, camarão e joelho por dentro.',
      idea: 'O cem quilos se defende com estrutura, não com força. Antebraço no pescoço e mão no quadril criam espaço; a ponte move o oponente; o camarão traz o seu joelho para dentro. Alternativa: sair por baixo com o underhook e vir de quatro.',
      steps: ['Frames: antebraço de cima na garganta ou no pescoço dele, mão de baixo no quadril, cotovelos fechados.', 'Vire de lado para ele, nunca fique plano.', 'Faça a ponte em direção a ele para aliviar o peso, e no retorno faça o camarão, afastando o quadril.', 'Coloque o joelho por dentro, entre você e ele, e recupere a guarda.', 'Se ele der espaço no underhook, gire por baixo e venha de quatro ou pegue as costas.'],
      details: ['Cotovelos colados nas costelas: frame com o esqueleto, não com músculo.', 'Ponte antes do camarão: espaço primeiro, movimento depois.', 'Joelho por dentro fecha a fuga.'],
      mistakes: ['Empurrar com os braços e ser finalizado.', 'Camarão sem ponte, ele acompanha.', 'Ficar de costas planas e esperar.'],
      concept: { text: 'Teoria dos frames: frame, ângulo e movimento do quadril trabalham juntos. Um frame sem movimento é só um braço cansado.', source: 'Fundamentos de escapes' },
      related: ['cem-quilos', 'escape-montada', 'retencao', 'escape-joelho-barriga'] },

    { id: 'escape-costas', cat: 'escape', name: 'Fuga das costas', alt: 'Back escape', level: 'Branca', style: 'Gi e No-Gi',
      summary: 'Proteja o pescoço, tire o gancho, coloque os ombros no chão e escorregue para o lado do braço de cima.',
      idea: 'Primeiro sobreviva: queixo baixo e mãos protegendo o pescoço. Depois retire o gancho do lado para onde vai escapar, leve os ombros ao tatame e escorregue o quadril para o lado do braço estrangulador (o braço que passa por cima). Termine com o oponente na sua guarda ou por cima dele.',
      steps: ['Mãos no braço estrangulador: uma mão no punho, a outra no cotovelo; queixo colado no peito.', 'Identifique o lado: escape para o lado do braço dele que passa por cima do ombro (lado fraco).', 'Retire o gancho desse lado com a mão ou pisando na perna dele.', 'Leve os ombros ao tatame, cabeça no chão, e escorregue o quadril para fora.', 'Vire para ele e recupere meia guarda ou passe por cima para o cem quilos.'],
      details: ['Não vire para o lado do underhook dele: é para lá que ele quer que você vá.', 'Ombros no chão primeiro; sem isso ele acompanha.', 'Mãos no braço dele até a fuga terminar.'],
      mistakes: ['Puxar o braço dele com força e virar para o lado errado.', 'Levantar a cabeça e dar o pescoço.', 'Fugir e não estabilizar por cima.'],

  /* ---------------- cronômetro ---------------- */
  const T = { total: 300, left: 300, phase: 'idle', endAt: 0, tick: null, count: null, countVal: 3 };
  const fmtT = sec => `${pad(Math.floor(sec / 60))}:${pad(Math.floor(sec % 60))}`;
  let audio;
  function beep(freq = 880, dur = .12, vol = .18) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + dur);
      o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
    } catch { /* sem áudio */ }
  }
  function timerSet(total) { T.total = Math.max(10, Math.min(3600, total)); T.left = T.total; T.phase = 'idle'; }
  function timerStart() {
    clearInterval(T.count);
    T.phase = 'count'; T.countVal = 3;
    beep(660);
    render();
    T.count = setInterval(() => {
      T.countVal -= 1;
      if (T.countVal >= 1) { beep(660); renderCountdown(); return; }
      if (T.countVal === 0) { beep(990, .25, .22); renderCountdown(); return; }
      clearInterval(T.count);
      timerRun();
    }, 1000);
  }
  function timerRun() {
    T.phase = 'run';
    T.endAt = Date.now() + T.left * 1000;
    clearInterval(T.tick);
    T.tick = setInterval(timerTick, 200);
    render();
  }
  function timerTick() {
    const left = Math.max(0, Math.ceil((T.endAt - Date.now()) / 1000));
    if (left !== T.left) {
      T.left = left;
      if (left <= 3 && left > 0) beep(660, .08, .12);
    }
    if (left === 0) {
      clearInterval(T.tick); T.phase = 'done';
      beep(990, .5, .25); setTimeout(() => beep(990, .5, .25), 600);
      if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
      if (tab === 'timer') render();
      return;
    }
    if (tab === 'timer') updateTimerDisplay();
  }
  function timerPause() { clearInterval(T.tick); T.left = Math.max(0, Math.ceil((T.endAt - Date.now()) / 1000)); T.phase = 'paused'; render(); }
  function timerReset() { clearInterval(T.tick); clearInterval(T.count); T.left = T.total; T.phase = 'idle'; render(); }
  function updateTimerDisplay() {
    const d = document.getElementById('tDigits'); if (d) d.textContent = fmtT(T.left);
    const r = document.getElementById('tRing'); if (r) { const C = Number(r.dataset.c); r.setAttribute('stroke-dashoffset', C * (1 - T.left / T.total)); }
  }
  function renderCountdown() {
    const el = document.getElementById('countdown'); if (!el) return;
    const go = T.countVal === 0;
    el.innerHTML = `<div class="n ${go ? 'go' : ''}" key="${T.countVal}">${go ? 'Valendo!' : T.countVal}</div><div class="hint">${fmtT(T.total)} no relógio</div>`;
  }
  function renderTimer() {
    const R = 110, C = 2 * Math.PI * R;
    const pct = T.left / T.total;
    const label = { idle: 'pronto', count: 'preparar', run: 'valendo', paused: 'pausado', done: 'tempo!' }[T.phase];
    const presets = [180, 300, 360, 420, 600];
    let ctrl;
    if (T.phase === 'idle') ctrl = `
      <div class="tadjust">
        <div class="field"><label>Minutos</label><div class="stepper">
          <button class="iconbtn" data-action="tadj" data-d="-60" aria-label="Menos um minuto">${I.minus}</button>
          <div class="val num">${Math.floor(T.total / 60)}</div>
          <button class="iconbtn" data-action="tadj" data-d="60" aria-label="Mais um minuto">${I.plus}</button></div></div>
        <div class="field"><label>Segundos</label><div class="stepper">
          <button class="iconbtn" data-action="tadj" data-d="-10" aria-label="Menos dez segundos">${I.minus}</button>
          <div class="val num">${pad(T.total % 60)}</div>
          <button class="iconbtn" data-action="tadj" data-d="10" aria-label="Mais dez segundos">${I.plus}</button></div></div>
      </div>
      <div class="presets">${presets.map(p => `<button class="chip ${p === T.total ? 'on' : ''}" data-action="tpreset" data-s="${p}">${p / 60} min</button>`).join('')}</div>
      <div class="tctrl"><button class="btn primary" data-action="tstart">${I.play} Iniciar</button></div>`;
    else if (T.phase === 'run') ctrl = `<div class="tctrl"><button class="btn" data-action="tpause">${I.pause} Pausar</button><button class="iconbtn big" data-action="treset" aria-label="Resetar">${I.reset}</button></div>`;
    else if (T.phase === 'paused') ctrl = `<div class="tctrl"><button class="btn primary" data-action="tresume">${I.play} Continuar</button><button class="iconbtn big" data-action="treset" aria-label="Resetar">${I.reset}</button></div>`;
    else ctrl = `<div class="tctrl"><button class="btn primary" data-action="treset">${I.reset} Resetar</button></div>`;
    return `
      <header class="topbar fade">
        <div>
          <div class="eyebrow">Rounds e drills</div>
          <h1 class="title">Cronômetro</h1>
        </div>
        <span class="pill soft num">${fmtT(T.total)}</span>
      </header>
      <div class="timer-wrap fade" style="animation-delay:.05s">
        <div class="tring ${T.phase === 'done' ? 'done' : ''}" role="timer" aria-live="off">
          <svg viewBox="0 0 250 250">
            <circle cx="125" cy="125" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="10"/>
            <circle id="tRing" data-c="${C}" cx="125" cy="125" r="${R}" fill="none" stroke="${T.phase === 'done' ? 'var(--accent)' : 'var(--ink)'}" stroke-width="10" stroke-linecap="round"
              stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" style="transition: stroke-dashoffset .2s linear"/>
          </svg>
          <div class="c"><div><div class="digits num" id="tDigits">${fmtT(T.left)}</div><div class="lbl">${label}</div></div></div>
        </div>
        ${ctrl}
      </div>
      ${T.phase === 'count' ? '<div class="countdown" id="countdown" aria-live="assertive"></div>' : ''}`;
  }

  /* ---------------- render ---------------- */
  function updateChatBadge() {
    const badge = document.getElementById('chatBadge');
    if (badge) badge.hidden = totalUnread() === 0;
  }

  function render() {
    settleConfirmations();
    const $tab = document.getElementById('tabbar');
    if (!auth) {
      $tab.hidden = true;
      $screen.className = 'screen';
      $screen.innerHTML = renderLogin();
      const u = document.getElementById('l-user'); if (u && !loginError) u.focus();
      return;
    }
    $tab.hidden = false;
    $screen.className = 'screen' + (tab === 'chat' && chatOpen ? ' chat-thread' : '');
    let html = '';
    if (tab === 'home') html = renderHome();
    else if (tab === 'aulas') html = renderAulas();
    else if (tab === 'biblioteca') html = libOpen ? renderMove(libOpen) : renderLib();
    else if (tab === 'chat') html = chatOpen ? renderChatThread(chatOpen) : renderChatList();
    else if (tab === 'timer') html = renderTimer();
    else html = renderPerfil();
    $screen.innerHTML = html;
    if (tab === 'timer' && T.phase === 'count') renderCountdown();
    if (chatOpen && tab === 'chat') {
      const $m = document.getElementById('msgs');
      if ($m) {
        const sep = $m.querySelector('.newsep');
        if (sep) $m.scrollTop = Math.max(0, sep.offsetTop - $m.offsetTop - 12); else $m.scrollTop = $m.scrollHeight;
      }
      markRead(chatOpen);
    } else {
      $screen.scrollTop = 0;
    }
    updateChatBadge();
  }

  /* ---------------- actions ---------------- */
  $screen.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el || el.tagName === 'FORM') return;
    const a = el.dataset.action;
    if (a === 'go') { chatOpen = null; libOpen = null; go(el.dataset.tab); }
    else if (a === 'toggle') {
      const k = `${el.dataset.date}|${el.dataset.cls}`;
      const c = byId[el.dataset.cls];
      if (classEnd(el.dataset.date, c) < now()) { toast('Aula encerrada. A presença é registrada pelo professor.'); return; }
      if (state.confirmations[k]) { delete state.confirmations[k]; toast('Confirmação cancelada'); }
      else { state.confirmations[k] = true; toast('Confirmação enviada. Aguardando o professor.'); }
      save(); render();
    }
    else if (a === 'openchat') { chatOpen = el.dataset.cls; go('chat'); }
    else if (a === 'closechat') { chatOpen = null; render(); }
    else if (a === 'openmove') { libOpen = el.dataset.id; if (tab !== 'biblioteca') go('biblioteca'); else render(); }
    else if (a === 'closemove') { libOpen = null; render(); }
    else if (a === 'libcat') { libCat = el.dataset.cat; render(); const inp = document.getElementById('libSearch'); if (inp && libQuery) inp.focus(); }
    else if (a === 'day') { aulasDay = el.dataset.day; render(); }
    else if (a === 'onlymine') { onlyMine = !onlyMine; render(); }
    else if (a === 'theme') {
      const root = document.documentElement;
      const dark = root.dataset.theme === 'dark' || (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
      root.dataset.theme = dark ? 'light' : 'dark';
    }
    else if (a === 'togglepw') { showPw = !showPw; const f = $screen.querySelector('form'); const u = f.user.value, p = f.pass.value; render(); const f2 = $screen.querySelector('form'); f2.user.value = u; f2.pass.value = p; f2.pass.focus(); }
    else if (a === 'signout') { try { localStorage.removeItem(AUTH_KEY); } catch {} auth = false; loginError = ''; tab = 'home'; render(); }
    else if (a === 'tadj') { timerSet(T.total + Number(el.dataset.d)); render(); }
    else if (a === 'tpreset') { timerSet(Number(el.dataset.s)); render(); }
    else if (a === 'tstart') timerStart();
    else if (a === 'tpause') timerPause();
    else if (a === 'tresume') timerRun();
    else if (a === 'treset') timerReset();
  });

  $screen.addEventListener('submit', e => {
    const form = e.target.closest('form[data-action]');
    if (!form) return;
    e.preventDefault();
    const a = form.dataset.action;
    const fd = new FormData(form);
    if (a === 'login') {
      const u = (fd.get('user') || '').toString().trim().toLowerCase();
      const p = (fd.get('pass') || '').toString();
      if (u === ACCESS.user && p === ACCESS.pass) {
        auth = true; loginError = '';
        try { localStorage.setItem(AUTH_KEY, '1'); } catch {}
        render();
        go('home'); toast(`Oss, ${me().name.split(' ')[0]}!`);
      } else {
        loginError = u && p ? 'Usuário ou senha incorretos.' : 'Preencha usuário e senha.';
        render();
        const f = $screen.querySelector('form'); if (f) { f.user.value = fd.get('user') || ''; f.pass.focus(); }
      }
      return;
    }
    if (a === 'send') {
      const text = (fd.get('text') || '').toString().trim();
      if (!text) return;
      const cid = form.dataset.cls;
      (state.chats[cid] ||= []).push({ id: 'u' + Date.now().toString(36), author: 'me', text, ts: Date.now() });
      markRead(cid); save(); render();
      const inp = $screen.querySelector('.composer input'); if (inp) inp.focus();
    }
  });

  $screen.addEventListener('input', e => {
    if (e.target.id !== 'libSearch') return;
    libQuery = e.target.value;
    const $l = document.getElementById('libList');
    if ($l) $l.innerHTML = libListHTML();
  });

  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

  go('home');
})();
</script>

</html>
